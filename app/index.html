<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vidhi-Vidhan App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@600;800&family=Anek+Kannada:wght@600;800&family=Anek+Tamil:wght@600;800&family=Anek+Telugu:wght@600;800&family=Anek+Malayalam:wght@600;800&family=Anek+Bangla:wght@600;800&family=Anek+Gujarati:wght@600;800&family=Anek+Gurmukhi:wght@600;800&family=Anek+Odia:wght@600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@500&family=Tiro+Devanagari+Hindi&family=Hind:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: a single phone-width app column, centred on wide screens; bottom tab bar; sheets slide up from the bottom; guided puja takes over the full screen in night colours. */
:root{
  --ground:#FFF6E6; --surface:#FFFFFF; --ink:#22140A; --muted:#6B5646; --line:#F0DCC0;
  --leaf:#D0115C; --leaf-soft:#FCE1EC; --haldi:#D98300; --haldi-soft:#FFEFC7; --kumkum:#D0115C; --kumkum-soft:#FCE1EC;
  --purple:#3E1585; --purple-2:#5B25B5; --marigold:#FFB21E; --green:#1D6A3A;
  --scrim:rgba(27,15,58,.55);
  --night:#15110C; --brass:#E9B850; --brass-dim:#9C7B3A; --night-ink:#F4EBDD; --night-muted:#B8A88E;
  --display:"Baloo 2", "Hind", system-ui, sans-serif;
  --body:"Hind", "Noto Sans Kannada", system-ui, sans-serif;
  --kn:"Noto Sans Kannada", "Hind", system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--leaf)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--haldi);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-block:20px 104px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;align-items:center;gap:12px}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.proto{font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.proto button{background:none;border:0;padding:0;color:var(--leaf);text-decoration:underline;font-size:.75rem}
.back{background:none;border:0;padding:0;color:var(--leaf);font-weight:600;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.sample{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}

.fest{background:repeating-conic-gradient(from 0deg at 85% 20%,rgba(255,255,255,.06) 0 8deg,transparent 8deg 16deg),radial-gradient(90% 90% at 85% 15%,var(--purple-2),var(--purple));box-shadow:0 0 0 3px var(--ground),0 0 0 5px var(--marigold);color:#FFF3D6;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.fest .eyebrow{color:#D7C6FF}
.fest .count{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--brass)}
.fest .lamps{position:absolute;right:-6px;top:14px;opacity:.9}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 6px;text-align:center;font-size:.75rem;line-height:1.3}
.day b{display:block;font-size:.95rem;font-weight:600}
.day.main{background:var(--brass);color:#2A1E07}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--kumkum);color:#fff}
.btn.green{background:var(--leaf);color:var(--surface)}
.btn.light{background:#FFF8E6;color:#1C231E}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:.88rem}
.btn.block{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{background:none;border:0;padding:0;color:var(--leaf);font-weight:600;font-size:.9rem;text-align:left}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task:last-child{padding-bottom:0}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;margin-top:2px}
.check[aria-checked="true"]{background:var(--leaf);border-color:var(--leaf)}
.check svg{opacity:0}
.check[aria-checked="true"] svg{opacity:1}
.task.done .t-title,.item.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:600}
.t-body{font-size:.9rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;border-radius:999px;padding:3px 10px;border:0}
.chip.time{background:var(--haldi-soft);color:var(--ink)}
.chip.family{background:var(--kumkum-soft);color:var(--ink)}
.chip.today{background:var(--leaf);color:var(--surface)}
.chip.who{background:var(--leaf-soft);color:var(--ink)}
.chip.assign{background:transparent;border:1px dashed var(--line);color:var(--muted)}
button.chip{cursor:pointer}

.tl-day{display:grid;grid-template-columns:56px 1fr;gap:12px;position:relative}
.tl-date{text-align:center;padding-top:2px}
.tl-date .d{font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.tl-date .w{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tl-day::before{content:"";position:absolute;left:27px;top:44px;bottom:-4px;width:1.5px;background:var(--line)}
.tl-day:last-child::before{display:none}
.tl-body{padding-bottom:20px;min-width:0}
.tl-day.fest-day .tl-date .d{color:var(--kumkum)}
.note{background:var(--kumkum-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.note .who{font-weight:600;font-size:.8rem}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0;padding-top:0}
.switch{flex:none;width:44px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{left:21px}

.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--leaf);transition:width .3s}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.item:last-child{padding-bottom:0}
.item .qty{margin-left:auto;font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.sub{font-size:.8rem;color:var(--muted)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--leaf-soft);color:var(--ink)}

.ob{display:flex;flex-direction:column;gap:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.opt b{font-weight:600}
.opt span{font-size:.8rem;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:24px;height:4px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--leaf)}
.kn{font-family:var(--kn)}

.member{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--haldi-soft);color:var(--ink);flex:none;font-size:.9rem}
textarea,select,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
textarea{min-height:80px;resize:vertical}
label.lbl{font-size:.85rem;font-weight:600;display:block;margin-bottom:6px}

/* Compare two family ways */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;font-size:.85rem;display:flex;flex-direction:column;gap:4px;min-width:0}
.side b{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.side[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

/* Voice note */
.vn{display:flex;align-items:center;gap:10px;background:var(--leaf-soft);border-radius:999px;padding:6px 14px 6px 6px}
.vn button{width:34px;height:34px;border-radius:50%;border:0;background:var(--leaf);color:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.vn .wave{flex:1;height:22px;display:flex;align-items:center;gap:2px}
.vn .wave i{flex:1;background:var(--muted);border-radius:2px;opacity:.5}
.vn .wave i.on{background:var(--leaf);opacity:1}
.vn .len{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* More grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:26px;height:26px;color:var(--leaf)}
.tile b{font-weight:600;line-height:1.25}
.tile span{font-size:.8rem;color:var(--muted);line-height:1.35}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t td,table.t th{padding:8px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t tr:first-child td,table.t tr:first-child th{border-top:0}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right!important;white-space:nowrap}
.budget input{text-align:right;padding:6px 8px;width:110px;font-variant-numeric:tabular-nums}

.story{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.story p.page{font-family:var(--display);font-size:1.25rem;line-height:1.5}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:3px solid var(--marigold);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:6px 0}
nav.tabs button[aria-current="page"]{color:var(--leaf)}
nav.tabs svg{width:22px;height:22px}

/* Bottom sheet */
.sheet{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-in .grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.choice[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

/* Guided puja mode */
.puja{position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 100%, #3A2A12 0%, var(--night) 60%);color:var(--night-ink);z-index:20;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));color-scheme:dark}
.puja .wrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;gap:14px}
.puja .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pbtn{background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:8px 14px;color:var(--night-ink);font-size:.85rem;font-weight:600}
.pbtn[aria-pressed="true"]{background:var(--brass);color:#2A1E07}
.puja .bar{display:flex;gap:4px;flex:1}
.puja .bar i{flex:1;height:3px;border-radius:3px;background:rgba(233,184,80,.22)}
.puja .bar i.on{background:var(--brass)}
.puja .scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;min-height:0;padding-bottom:8px}
.puja .num{font-family:var(--display);color:var(--brass);font-size:.95rem;text-align:left!important}
.puja h2{font-size:2rem;color:#FFF5E0}
.puja .do{font-size:1.2rem;line-height:1.55}
.mantra{border:1px solid rgba(233,184,80,.35);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;background:rgba(233,184,80,.06)}
.mantra .script{font-size:1.45rem;line-height:1.5;color:#FFF1CF}
.mantra .tr{font-style:italic;color:var(--night-muted)}
.mantra .lab{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.why{color:var(--night-muted);font-size:.98rem;border-left:2px solid var(--brass-dim);padding-left:12px}
.why b{color:var(--brass);font-weight:600}
.puja .fnote{background:rgba(240,104,126,.12);border-radius:12px;padding:10px 12px;font-size:.95rem}
.puja .fnote .who{font-weight:600;color:#F7B3BE;font-size:.8rem}
.puja .tools{display:flex;gap:8px;flex-wrap:wrap}
.puja .nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.puja .nav button{border:0;border-radius:999px;padding:16px;font-weight:600;font-size:1rem}
.puja .prev{background:rgba(255,255,255,.08);color:var(--night-ink)}
.puja .next{background:var(--brass);color:#2A1E07}
.puja .hint{text-align:center;font-size:.75rem;color:var(--night-muted)}
.diya{display:block;margin:0 auto}
.flame{transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) rotate(-1deg)}50%{transform:scaleY(1.08) rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){.flame{animation:none}.progress span,.switch::after{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:40;max-width:90%;text-align:center}

/* ---- Festive app chrome ---- */
.btn{font-family:var(--display);font-weight:700}
.btn.primary{box-shadow:0 3px 0 #A80B49}
.appbar{background:var(--purple);color:#FFF3D6;border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 0 0 3px var(--ground),0 0 0 5px var(--marigold)}
.appbar .lk{display:flex;flex-direction:column;line-height:1;text-decoration:none}
.appbar .lk .d{font:700 .7rem "Baloo 2",sans-serif;color:var(--marigold)}
.appbar .lk .w{font:800 1.1rem "Baloo 2",sans-serif;color:#FF5C9E;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.appbar .lk{flex:none}
.appbar .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.appbar .acts button,.appbar .acts a{font:700 .8rem "Baloo 2",sans-serif;background:rgba(255,255,255,.12);color:#FFF3D6;border:0;border-radius:999px;padding:5px 11px;text-decoration:none;cursor:pointer}
.appbar .acts .j{background:var(--marigold);color:var(--purple)}
.prev-note{font-size:.75rem;color:var(--muted);margin-top:-12px}
.notice{background:var(--haldi-soft);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:2px dashed var(--marigold)}
.notice b{font-family:var(--display)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;background:var(--purple);color:#FFF3D6;font:700 .9rem "Baloo 2",sans-serif;padding:10px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px -6px rgba(27,15,58,.5),0 0 0 2px var(--marigold);cursor:pointer}
@media (min-width:700px){.fab{right:calc(50% - 220px + 16px)}}
.namein{width:100%;font:inherit;font-size:1.05rem;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;color:var(--ink)}
.namein:focus{border-color:var(--leaf);outline:none}
/* Tour */
.tour{position:fixed;inset:0;z-index:50}
.tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(27,15,58,.62),0 0 0 3px var(--marigold);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.tour .tip{position:fixed;left:50%;transform:translateX(-50%);width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 40px -10px rgba(0,0,0,.4);transition:top .35s cubic-bezier(.2,.8,.2,1)}
.tour .tip .k{font:700 .75rem "Baloo 2",sans-serif;color:var(--leaf);letter-spacing:.06em;text-transform:uppercase}
.tour .tip h3{font-size:1.2rem}
.tour .tip p{color:var(--muted);font-size:.95rem}
.tour .tip .row{justify-content:space-between}
.tour .tip .dots i{width:16px}
@media (prefers-reduced-motion: reduce){.tour .spot,.tour .tip{transition:none}}

/* ---- Review fixes ---- */
.check[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.progress span{background:var(--green)}
.switch[aria-checked="true"]{background:var(--green)}
[data-sim]::after{content:"Demo";font:700 .62rem "Baloo 2",sans-serif;letter-spacing:.06em;text-transform:uppercase;background:rgba(0,0,0,.18);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:2px}
.seg button{font-family:var(--display)}
.tipcard{background:var(--haldi-soft);border:2px solid var(--marigold);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;font-size:.92rem}
.tipcard .link{white-space:nowrap}
.remind .notif{background:var(--ground);border-radius:14px;padding:10px 12px;font-size:.92rem;border-left:4px solid var(--marigold)}
.remind .notif b{display:block;font-size:.75rem;color:var(--muted);font-weight:600}
.plist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.plist li{padding-left:4px}
.plist li span + .sample{margin-left:8px}
.react{display:flex;flex-direction:column;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:16px;padding:14px;max-width:360px}

/* ---- Family rituals editor: built for elders ---- */

let tourI = 0, tourEl = null;
function startTour(){ if(route() !== "home") return; tourI = 0; if(!tourEl){ tourEl = document.createElement("div"); tourEl.className = "tour"; tourEl.setAttribute("role","dialog"); tourEl.setAttribute("aria-modal","true"); tourEl.setAttribute("aria-label","Quick tour"); tourEl.innerHTML = `<div class="spot"></div><div class="tip"></div>`; document.body.appendChild(tourEl); } tourEl.hidden = false; showTour(); }
function endTour(){ track(tourI >= TOUR.length - 1 ? "tour-done" : "tour-skip-" + (tourI+1)); S.tourDone = true; save(); if(tourEl) tourEl.hidden = true; }
function showTour(){
  const st = TOUR[tourI], el = document.querySelector(st.sel);
  if(!el){ if(tourI < TOUR.length - 1){ tourI++; return showTour(); } return endTour(); }
  el.scrollIntoView({block:"center", behavior:"instant" in window ? "auto" : "auto"});
  requestAnimationFrame(()=>{
    const r = el.getBoundingClientRect(), pad = 6, sp = tourEl.querySelector(".spot"), tip = tourEl.querySelector(".tip");
    Object.assign(sp.style, {left:(r.left-pad)+"px", top:(r.top-pad)+"px", width:(r.width+pad*2)+"px", height:(r.height+pad*2)+"px"});
    tip.innerHTML = `<span class="k">${tourI+1} of ${TOUR.length} · ${st.k}</span><h3>${st.t}</h3><p>${st.p}</p><div class="row"><button class="link" data-tour="skip">Skip</button><div class="row" style="gap:8px">${tourI?'<button class="btn ghost sm" data-tour="back">Back</button>':""}<button class="btn primary sm" data-tour="next">${tourI === TOUR.length-1 ? "Start exploring" : "Next"}</button></div></div>`;
    const below = r.bottom + 16, th = tip.offsetHeight || 190;
    tip.style.top = (below + th < innerHeight - 8 ? below : Math.max(12, r.top - th - 16)) + "px";
    tip.querySelector('[data-tour="next"]').focus();
  });
}
document.addEventListener("click", e=>{ const b = e.target.closest("[data-tour]"); if(!b) return; const a = b.dataset.tour;
  if(a === "skip") endTour(); else if(a === "back"){ tourI = Math.max(0, tourI-1); showTour(); } else if(tourI < TOUR.length-1){ tourI++; showTour(); } else endTour(); });
document.addEventListener("keydown", e=>{ if(tourEl && !tourEl.hidden && e.key === "Escape") endTour(); });
addEventListener("resize", ()=>{ if(tourEl && !tourEl.hidden) showTour(); });

const et = k => ((EL_T[S.elderLang] || EL_T.en)[k] ?? EL_T.en[k]);

let EDIT = null, ESCREEN = 0, FROM = "blank", REC = null, LISTEN = null, DEL_PENDING = null, RIT = null;

/* Voice notes are kept in this browser's IndexedDB */
function idb(){ return new Promise((res, rej)=>{ try{ const r = indexedDB.open("vv-audio", 1); r.onupgradeneeded = ()=>r.result.createObjectStore("clips"); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }catch(e){ rej(e); } }); }
async function clipPut(k, blob){ const d = await idb(); return new Promise((res, rej)=>{ const tx = d.transaction("clips","readwrite"); tx.objectStore("clips").put(blob, k); tx.oncomplete = res; tx.onerror = ()=>rej(tx.error); }); }
async function clipGet(k){ const d = await idb(); return new Promise((res, rej)=>{ const q = d.transaction("clips").objectStore("clips").get(k); q.onsuccess = ()=>res(q.result); q.onerror = ()=>rej(q.error); }); }
async function playClip(k){ try{ const b = await clipGet(k); if(!b){ toast("This recording is on another phone"); return; } const a = new Audio(URL.createObjectURL(b)); a.play(); }catch(e){ toast("Couldn't play the recording"); } }

function ritCard(r){
  const confirm = DEL_PENDING === r.id;
  return `<div class="card stack ritcard" style="gap:8px">
    <div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="t-title">${esc(r.title)}</div><div class="small muted">${esc(r.occ)} · by ${esc(r.by)} · ${r.steps.length} step${r.steps.length===1?"":"s"}${r.steps.some(s=>s.audio)?" · with voice":""}</div></div>${r.ex?`<span class="sample">Example</span>`:""}</div>
    <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn primary sm" data-act="ritplay" data-id="${r.id}">Follow along</button><button class="btn ghost sm" data-act="ritedit" data-id="${r.id}">Edit</button><button class="btn ghost sm" data-act="ritdel" data-id="${r.id}">${confirm ? "Tap again to remove" : "Remove"}</button></div>
  </div>`;
}
function ritualsSection(){
  return `<section class="stack" id="rituals">
    <div class="section-head"><h2>Family rituals</h2><span class="small muted">${S.rituals.length} saved</span></div>
    <p class="small muted">The whole vidhi-vidhan, written by your family in your family's way. Elders can type or just speak each step, and record their own voice.</p>
    ${S.rituals.length ? S.rituals.map(ritCard).join("") : `<div class="card"><p class="muted">No family rituals yet. Amma, Ajji or anyone who knows can add one.</p></div>`}
    <div class="row" style="flex-wrap:wrap;gap:8px"><button class="btn primary" data-act="ritnew">Add your family's vidhi-vidhan</button><button class="btn ghost sm" data-act="ritask" data-sim>Ask an elder to add one</button></div>
  </section>`;
}

/* ---------- Editor ---------- */
function openEditor(r){
  EDIT = r ? JSON.parse(JSON.stringify(r)) : {id:"r" + Date.now(), title:"", occ:"Deepavali", by:(MEMBERS[3] && MEMBERS[3].n) || "Amma", steps:[]};
  delete EDIT.ex; ESCREEN = r ? 1 : 0; FROM = "blank";
  $("#elder").hidden = false; document.body.style.overflow = "hidden"; renderEditor(); track("ritual-editor-" + (r ? "edit" : "new"));
}
function closeEditor(){ stopRec(); stopListen(); $("#elder").hidden = true; document.body.style.overflow = ""; EDIT = null; }
function micBtn(f, i){ return SR ? `<button class="emic ${LISTEN && LISTEN.f===f && LISTEN.i===i ? "on" : ""}" data-e="mic" data-f="${f}" data-ix="${i}" aria-label="${et("speak")}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>${LISTEN && LISTEN.f===f && LISTEN.i===i ? et("listening") : et("speak")}</span></button>` : ""; }
function renderEditor(){
  const big = !!S.elderBig, langs = [["en","English"],["hi","हिन्दी"],["kn","ಕನ್ನಡ"]];
  const top = `<div class="etop"><button class="ex" data-e="close">${et("close")}</button>
    <div class="elang" role="group" aria-label="Language">${langs.map(([k,v])=>`<button aria-pressed="${(S.elderLang||"en")===k}" data-e="lang" data-v="${k}">${v}</button>`).join("")}</div>
    <button class="ebig" aria-pressed="${big}" data-e="big">A+ <span>${et("bigger")}</span></button></div>`;
  let body;
  if(ESCREEN === 0){
    body = `<h1>${et("title")}</h1>
      <div class="ef"><label>${et("who")}</label><div class="echips">${MEMBERS.map(m=>`<button aria-pressed="${EDIT.by===m.n}" data-e="by" data-v="${esc(m.n)}">${esc(m.n)}</button>`).join("")}</div></div>
      <div class="ef"><label for="e_title">${et("name")}</label><div class="frow"><input id="e_title" data-f="title" value="${esc(EDIT.title)}" placeholder="${esc(et("name_ph"))}" maxlength="60">${micBtn("title",-1)}</div></div>
      <div class="ef"><label for="e_occ">${et("occ")}</label><select id="e_occ" data-f="occ">${OCC.map(o=>`<option ${EDIT.occ===o?"selected":""} value="${o}">${o==="Other"?et("other"):o}</option>`).join("")}</select></div>
      <div class="ef"><label>${et("start")}</label><div class="echoice"><button aria-pressed="${FROM==="blank"}" data-e="from" data-v="blank">${et("blank")}</button><button aria-pressed="${FROM==="tmpl"}" data-e="from" data-v="tmpl">${et("tmpl")}</button></div></div>
      <button class="ebtn primary" data-e="next">${et("next")}</button>`;
  } else {
    body = `<button class="elink" data-e="back">← ${et("back")}</button>
      <h1>${esc(EDIT.title || et("title"))}</h1><p class="ehint">${et("steps_h")} · ${et("steps_hint")}</p>
      ${EDIT.steps.map((s,i)=>`<div class="estep">
        <div class="eh"><span class="enum">${et("step")} ${i+1}</span><div class="ectl"><button data-e="up" data-ix="${i}" aria-label="${et("up")}" ${i===0?"disabled":""}>↑</button><button data-e="down" data-ix="${i}" aria-label="${et("down")}" ${i===EDIT.steps.length-1?"disabled":""}>↓</button><button data-e="del" data-ix="${i}">${et("del")}</button></div></div>
        <div class="ef"><label for="t${i}">${et("st_t")}</label><div class="frow"><input id="t${i}" data-f="t" data-ix="${i}" value="${esc(s.t)}" maxlength="80">${micBtn("t",i)}</div></div>
        <div class="ef"><label for="d${i}">${et("st_d")}</label><div class="frow"><textarea id="d${i}" data-f="d" data-ix="${i}" rows="3" maxlength="600">${esc(s.d)}</textarea>${micBtn("d",i)}</div></div>
        <details ${s.w || s.i ? "open" : ""}><summary>${et("more")}</summary>
          <div class="ef"><label for="w${i}">${et("st_w")}</label><div class="frow"><textarea id="w${i}" data-f="w" data-ix="${i}" rows="2" maxlength="300">${esc(s.w||"")}</textarea>${micBtn("w",i)}</div></div>
          <div class="ef"><label for="i${i}">${et("st_i")}</label><input id="i${i}" data-f="i" data-ix="${i}" value="${esc(s.i||"")}" maxlength="160"></div>
        </details>
        <div class="evoice">${REC && REC.i===i ? `<button class="ebtn rec" data-e="recstop" data-ix="${i}">● ${et("stop")}</button>`
          : s.audio ? `<button class="ebtn ghost" data-e="play" data-ix="${i}">▶ ${et("play")}</button><button class="elink" data-e="rec" data-ix="${i}">${et("redo")}</button>`
          : `<button class="ebtn ghost" data-e="rec" data-ix="${i}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg> ${et("rec")}</button>`}</div>
      </div>`).join("")}
      <button class="ebtn ghost" data-e="add">+ ${et("add_step")}</button>
      <button class="ebtn primary" data-e="save">${et("save")}</button>
      <p class="ehint">${et("local_note")}</p>`;
  }
  const el = $("#elder"); el.classList.toggle("big", big); el.setAttribute("lang", S.elderLang || "en");
  el.innerHTML = `<div class="ein">${top}${body}</div>`;
}
function syncField(t){ if(!EDIT || !t.dataset.f) return; const f = t.dataset.f, i = Number(t.dataset.ix);
  if(f === "title" || f === "occ") EDIT[f] = t.value; else if(EDIT.steps[i]) EDIT.steps[i][f] = t.value; }
function stopListen(){ if(LISTEN){ try{ LISTEN.r.stop(); }catch(e){} LISTEN = null; } }
function startListen(f, i){
  stopListen();
  const r = new SR(); r.lang = {en:"en-IN", hi:"hi-IN", kn:"kn-IN"}[S.elderLang || "en"]; r.interimResults = false; r.continuous = false;
  LISTEN = {r, f, i}; renderEditor();
  r.onresult = e=>{ const text = Array.from(e.results).map(x=>x[0].transcript).join(" ").trim(); if(!text) return;
    if(f === "title") EDIT.title = (EDIT.title ? EDIT.title + " " : "") + text; else { const s = EDIT.steps[i]; s[f] = (s[f] ? s[f] + " " : "") + text; } };
  r.onerror = ()=>{ toast(et("mic_no")); }; r.onend = ()=>{ LISTEN = null; renderEditor(); };
  try{ r.start(); track("ritual-speak"); }catch(e){ LISTEN = null; toast(et("mic_no")); renderEditor(); }
}
function stopRec(){ if(REC){ try{ REC.mr.stop(); }catch(e){} } }
async function startRec(i){
  if(!CAN_REC){ toast(et("mic_no")); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true}), chunks = [], mr = new MediaRecorder(stream);
    mr.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    mr.onstop = async ()=>{ stream.getTracks().forEach(t=>t.stop()); const key = EDIT.id + "-" + i + "-" + Date.now();
      try{ await clipPut(key, new Blob(chunks, {type: mr.mimeType || "audio/webm"})); if(EDIT && EDIT.steps[i]) EDIT.steps[i].audio = key; track("ritual-voice"); }catch(e){ toast("Couldn't save the recording"); }
      REC = null; if(EDIT) renderEditor(); };
    REC = {mr, i}; mr.start(); renderEditor();
  }catch(e){ REC = null; toast(et("mic_no")); }
}
function saveRitual(){
  EDIT.title = (EDIT.title || "").trim();
  EDIT.steps = EDIT.steps.map(s=>({t:(s.t||"").trim(), d:(s.d||"").trim(), w:(s.w||"").trim(), i:(s.i||"").trim(), audio:s.audio||""})).filter(s=>s.t || s.d || s.audio);
  if(!EDIT.title){ ESCREEN = 0; renderEditor(); toast(et("need_name")); return; }
  if(!EDIT.steps.length){ if(!EDIT.steps.length) EDIT.steps.push({t:"",d:"",w:"",i:""}); renderEditor(); toast(et("need_step")); return; }
  const k = S.rituals.findIndex(r=>r.id === EDIT.id); EDIT.updated = Date.now();
  if(k >= 0) S.rituals[k] = EDIT; else S.rituals.unshift(EDIT);
  save(); track("ritual-saved-" + EDIT.steps.length); const msg = et("saved"); closeEditor(); if(route() !== "family") go("family"); else rerender(); toast(msg);
}
document.addEventListener("input", e=>{ if(e.target.closest("#elder")) syncField(e.target); });
document.addEventListener("change", e=>{ if(e.target.closest("#elder")) syncField(e.target); });
document.addEventListener("click", e=>{
  const b = e.target.closest("#elder [data-e]"); if(!b) return;
  const a = b.dataset.e, i = Number(b.dataset.ix);
  switch(a){
    case "close": closeEditor(); break;
    case "lang": S.elderLang = b.dataset.v; save(); renderEditor(); break;
    case "big": S.elderBig = !S.elderBig; save(); renderEditor(); break;
    case "by": EDIT.by = b.dataset.v; renderEditor(); break;
    case "from": FROM = b.dataset.v; renderEditor(); break;
    case "next": { const t = $("#e_title"); if(t) EDIT.title = t.value; if(!EDIT.title.trim()){ toast(et("need_name")); $("#e_title").focus(); return; }
      if(!EDIT.steps.length) EDIT.steps = FROM === "tmpl" ? STEPS.map(s=>({t:s.t, d:s.do, w:s.why, i:""})) : [{t:"",d:"",w:"",i:""}];
      ESCREEN = 1; renderEditor(); $("#elder").scrollTop = 0; break; }
    case "back": ESCREEN = 0; renderEditor(); break;
    case "add": EDIT.steps.push({t:"",d:"",w:"",i:""}); renderEditor(); const last = $("#t" + (EDIT.steps.length-1)); if(last){ last.scrollIntoView({block:"center"}); last.focus(); } break;
    case "del": EDIT.steps.splice(i,1); renderEditor(); break;
    case "up": if(i>0){ [EDIT.steps[i-1], EDIT.steps[i]] = [EDIT.steps[i], EDIT.steps[i-1]]; renderEditor(); } break;
    case "down": if(i<EDIT.steps.length-1){ [EDIT.steps[i+1], EDIT.steps[i]] = [EDIT.steps[i], EDIT.steps[i+1]]; renderEditor(); } break;
    case "mic": if(LISTEN){ stopListen(); renderEditor(); } else startListen(b.dataset.f, i); break;
    case "rec": startRec(i); break;
    case "recstop": stopRec(); break;
    case "play": playClip(EDIT.steps[i].audio); break;
    case "save": saveRitual(); break;
  }
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape" && !$("#elder").hidden) closeEditor(); });

/* ---------- Family-side actions ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b || b.closest("#elder")) return;
  const act = b.dataset.act, id = b.dataset.id;
  if(act === "ritnew"){ openEditor(null); }
  else if(act === "ritedit"){ const r = S.rituals.find(x=>x.id===id); if(r) openEditor(r); }
  else if(act === "ritdel"){ if(DEL_PENDING === id){ S.rituals = S.rituals.filter(x=>x.id!==id); DEL_PENDING = null; save(); } else { DEL_PENDING = id; setTimeout(()=>{ if(DEL_PENDING===id){ DEL_PENDING = null; if(route()==="family") rerender(); } }, 4000); } rerender(); }
  else if(act === "ritplay"){ const r = S.rituals.find(x=>x.id===id); if(!r) return; RIT = r; track("ritual-play"); openPuja(); }
  else if(act === "ritvoice"){ playClip(b.dataset.k); }
  else if(act === "ritask"){ const url = location.href.split("#")[0] + "#elder"; const l = document.createElement("a"); l.href = "https://wa.me/?text=" + encodeURIComponent("Could you write down how we do one of our rituals, step by step? You can type or just speak: " + url); l.target = "_blank"; l.rel = "noopener"; document.body.appendChild(l); l.click(); l.remove(); track("ritual-ask"); }
}, true);
function ritExtras(s){
  return `${s.items ? `<div class="fnote" style="background:rgba(233,184,80,.12)"><div class="who" style="color:#E9B850">Things needed</div>${esc(s.items)}</div>` : ""}${s.audio ? `<button class="pbtn" data-act="ritvoice" data-k="${esc(s.audio)}">▶ Play ${esc(RIT.by)}'s voice</button>` : ""}`;
}
if(location.hash === "#elder") setTimeout(()=>openEditor(null), 300);


/* ================= Festival calendar: past, today, upcoming ================= */

function localeSheet(q){
  q = (q || "").toLowerCase();
  const row = r => `<button class="opt locst" aria-pressed="${r[0] === S.st}" data-act="setst" data-id="${r[0]}"><b>${esc(stName(r[0]))}</b><span>${FESTS.filter(f => f.r.includes(r[0])).length} · ${FL[r[2]].own}</span></button>`;
  const f = arr => arr.filter(r => !q || r[1].toLowerCase().includes(q) || stName(r[0]).toLowerCase().includes(q));
  sheet(`<h2>${U("choose")}</h2>
    <p class="eyebrow" style="margin-top:14px">${U("language")}</p>
    <div class="langs">${Object.entries(FL).map(([k, v]) => `<button class="opt" aria-pressed="${k === S.ui}" data-act="setui" data-id="${k}" lang="${k}"><b>${v.own}</b><span>${v.name}</span></button>`).join("")}</div>
    <p class="eyebrow" style="margin-top:18px">${U("state")}</p>

    <p class="small muted" style="margin-top:12px">${U("uts")}</p><div class="opts">${f(FREG.filter(r => r[3] === "u")).map(row).join("")}</div>`);
  const i = document.getElementById("locq"); if(i){ i.oninput = () => { const v = i.value, p = i.selectionStart; localeSheet(v); const j = document.getElementById("locq"); j.focus(); j.setSelectionRange(p, p); }; }
}
function applyLocale(){
  document.documentElement.lang = S.ui;
  const lab = {home:"tab_home", prepare:"tab_plan", calendar:"tab_cal", pujaview:"tab_puja", family:"tab_family", fests:"tab_fests"};
  document.querySelectorAll("#tabs button[data-go]").forEach(b => { const k = lab[b.dataset.go]; if(!k) return; const sv = b.querySelector("svg"); b.textContent = ""; if(sv) b.appendChild(sv); b.appendChild(document.createTextNode(U(k))); });
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if(!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if(act === "openfest"){ S.fid = id; save(); go("fest"); track("fest-" + id); }
  else if(act === "locale"){ localeSheet(""); track("locale-open"); }
  else if(act === "setui"){ S.ui = id; save(); applyLocale(); localeSheet(""); rerender(); track("ui-" + id); }
  else if(act === "setst"){ S.st = id; syncRegion(); save(); closeSheet(); if(route() === "fest") go("fests"); else rerender(); track("st-" + id); }
  else if(act === "ftrad"){ S.ftrad = id; save(); rerender(); }
  else if(act === "fneed"){ const i = +a.dataset.i; (S.fneed[id] ||= [])[i] = !S.fneed[id][i]; save(); rerender(); }
});

const VIEWS = ["fests","fest","calendar","pujaview","home","prepare","samagri","family","more","welcome","events","griha","priests","panchang","vrats","shraddha","recipes","rangoli","stories","nearby","abroad"];
function route(){ const h = location.hash.replace("#",""); return VIEWS.includes(h) ? h : (S.onboarded ? "home" : "welcome"); }
function go(v){ if(location.hash !== "#"+v) location.hash = v; else render(); }
window.addEventListener("hashchange", render);
const TAB_OF = {fest:"fests",samagri:"prepare",more:"home",events:"home",griha:"home",priests:"home",panchang:"calendar",vrats:"calendar",shraddha:"home",recipes:"home",rangoli:"home",stories:"home",nearby:"home",abroad:"home"};

function render(){
  const v = route();
  $("#tabs").hidden = v === "welcome";
  const tab = TAB_OF[v] || v;
  document.querySelectorAll("#tabs button").forEach(b => { if(b.dataset.go===tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const map = {fests:viewFests, fest:viewFest, calendar:viewCalendar, pujaview:viewPuja, home:viewHome, prepare:viewPrepare, samagri:viewSamagri, family:viewFamily, more:viewMore, welcome:viewWelcome, events:viewEvents, griha:viewGriha, priests:viewPriests, panchang:viewPanchang, vrats:viewVrats, shraddha:viewShraddha, recipes:viewRecipes, rangoli:viewRangoli, stories:viewStories, nearby:viewNearby, abroad:viewAbroad};
  MEMBERS[0].n = S.name || "You"; MEMBERS[0].i = (S.name || "You").slice(0,2);
  $("#app").innerHTML = map[v]();
  if(v !== render.last){ track("view-" + v); render.last = v; }
  $("#fab").hidden = v === "welcome";
  if(v === "home" && S.onboarded && !S.tourDone) setTimeout(startTour, 350);
  applyLocale();
  if(!render.keep) window.scrollTo(0,0);
  render.keep = false;
}
function rerender(){ render.keep = true; const y = window.scrollY; render(); window.scrollTo(0,y); }

/* ================= Rangoli ================= */
let rStep = 0;
function rangoliSVG(layer){
  const pts=[]; for(let y=0;y<7;y++) for(let x=0;x<7;x++) pts.push([30+x*30,30+y*30]);
  const dots = pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="var(--muted)"/>`).join("");
  const outline = `<path d="M120 30L210 120L120 210L30 120Z" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="120" cy="120" r="48" fill="none" stroke="var(--ink)" stroke-width="2.5"/>`;
  const petals = [0,90,180,270].map(a=>`<ellipse cx="120" cy="56" rx="14" ry="22" transform="rotate(${a} 120 120)" fill="${layer>=4?"var(--kumkum)":"none"}" fill-opacity=".85" stroke="var(--ink)" stroke-width="2"/>`).join("") + [45,135,225,315].map(a=>`<ellipse cx="120" cy="64" rx="9" ry="15" transform="rotate(${a} 120 120)" fill="${layer>=4?"var(--haldi)":"none"}" stroke="var(--ink)" stroke-width="2"/>`).join("");
  const lamp = `<path d="M96 126h48c-2 12-12 20-24 20s-22-8-24-20z" fill="${layer>=4?"#B8742A":"none"}" stroke="var(--ink)" stroke-width="2.5"/><path d="M120 92c-7 10-8 14-8 18a8 8 0 0 0 16 0c0-4-1-8-8-18z" fill="${layer>=4?"var(--haldi)":"none"}" stroke="var(--ink)" stroke-width="2.5"/>`;
  const fill = layer>=4?`<circle cx="120" cy="120" r="46" fill="var(--leaf)" fill-opacity=".25"/>`:"";
  return `<svg viewBox="0 0 240 240" width="100%" style="max-width:300px;display:block;margin:0 auto" role="img" aria-label="Diya rangoli, step ${layer}">${fill}${layer>=2?outline:""}${layer>=3?petals+lamp:""}${dots}</svg>`;
}
function viewRangoli(){
  const steps = [
    ["Place the dots","Make a 7 by 7 grid of dots, about two fingers apart. Start from the centre dot so the design stays even."],
    ["Draw the frame","Join the middle dot of each edge to make a diamond. Draw a circle around the centre, passing between the inner dots."],
    ["Add the diya and petals","Draw the diya in the centre: a bowl, then the flame. Add four large petals on the diamond's points and four small ones between them."],
    ["Fill in the colours","Red for the large petals, yellow for the small ones and the flame, green inside the circle. Outline again in white at the end."]
  ];
  const s = steps[rStep];
  return `${back()}
    <div class="stack" style="gap:6px"><p class="eyebrow">Rangoli · beginner · 20 min</p><h1>Diya rangoli, 7 dots</h1></div>
    <div class="card stack">${rangoliSVG(rStep+1)}
      <div class="dots" style="justify-content:center">${steps.map((_,i)=>`<i class="${i<=rStep?"on":""}"></i>`).join("")}</div>
      <h3>${rStep+1}. ${s[0]}</h3><p>${s[1]}</p>
      <div class="row"><button class="btn ghost" data-act="rprev" ${rStep===0?"disabled":""}>Back</button><button class="btn green" style="flex:1" data-act="rnext">${rStep===3?"Start again":"Next step"}</button></div>
    </div>
    <p class="small muted">More designs for each festival come in the full app, including padi kolam for Tamil households.</p>`;
}

/* ================= Stories ================= */
let story = null, sPage = 0;
function viewStories(){
  if(story){ const st = STORIES[story]; return `<button class="back" data-act="storyclose"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg>All stories</button>
    <div class="story"><p class="eyebrow">${st.t} · ${sPage+1} of ${st.pages.length}</p>${sPage===st.pages.length-1?diya(80):""}<p class="page">${st.pages[sPage]}</p>
    <div class="row" style="margin-top:auto"><button class="btn ghost" data-act="sprev" ${sPage===0?"disabled":""}>Back</button><button class="btn green" style="flex:1" data-act="snext">${sPage===st.pages.length-1?"The end":"Next page"}</button><button class="btn ghost" data-act="sread" aria-label="Read aloud">Read aloud</button></div></div>`; }
  return `${back()}
    <div class="stack" style="gap:6px"><p class="eyebrow">For kids</p><h1>Why we celebrate Deepavali</h1><p class="muted">Short stories to read together, a few lines a page.</p></div>
    ${Object.entries(STORIES).map(([k,s])=>`<button class="card row" style="text-align:left" data-act="story" data-k="${k}"><span style="color:var(--haldi)">${ic("stories")}</span><span style="flex:1"><span class="t-title" style="display:block">${s.t}</span><span class="small muted">${s.pages.length} pages</span></span></button>`).join("")}`;
}

/* ================= Nearby & abroad ================= */
function viewNearby(){
  const ev = [["Deepotsava at the neighbourhood temple","Sat 7 Nov · 6:30 PM","Lamps lit around the temple tank"],["Community Lakshmi puja","Sun 8 Nov · 6:15 PM","Apartment clubhouse, all welcome"],["Akasha butti making for kids","Sun 1 Nov · 4:00 PM","Bring old newspapers and glue"],["Temple timings during Deepavali","6 to 9 Nov","Open 5:30 AM to 9:30 PM"]];
  return `${back()}
    <div class="stack" style="gap:6px"><p class="eyebrow">Near you · Bengaluru</p><h1>Around the neighbourhood</h1><p class="muted"><span class="sample">Sample listings</span></p></div>
    <div class="card">${ev.map(([t,w,b])=>`<div class="item"><div style="min-width:0"><div class="t-title">${t}</div><div class="small" style="color:var(--leaf);font-weight:600">${w}</div><div class="sub">${b}</div></div></div>`).join("")}</div>
    <p class="small muted">Temples and communities will be able to post their own events.</p>`;
}
function viewAbroad(){
  return `${back()}
    <div class="stack" style="gap:6px"><p class="eyebrow">Living abroad</p><h1>Deepavali away from home</h1></div>
    <section class="card stack" style="gap:4px"><div class="toggle"><div><div class="t-title">Abroad mode</div><div class="sub">Shows timings for your city and substitutes on the samagri list</div></div>${sw(S.nri.on,"nri",'aria-label="Abroad mode"')}</div>
      <div style="padding-top:8px"><label class="lbl" for="ncity">Your city</label><select id="ncity" data-act-change="city">${Object.keys(NRI).map(c=>`<option ${c===S.nri.city?"selected":""}>${c}</option>`).join("")}</select></div></section>
    <section class="stack"><h2>Lakshmi puja in ${S.nri.city}</h2>
      <div class="card stack"><div class="row between"><span class="t-title">Sun 8 Nov</span><span class="chip time">${NRI[S.nri.city]}</span></div>
      <p class="small muted">The muhurat follows sunset in ${S.nri.city}, not India time. Don't just convert the Bengaluru timing. <span class="sample">Approximate</span></p></div></section>
    <section class="stack"><h2>Hard to find?</h2><div class="card"><table class="t">${SUBS.map(([a,b])=>`<tr><th style="width:36%;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink)">${a}</th><td>${b}</td></tr>`).join("")}</table></div></section>
    <a class="btn ghost block" href="https://www.google.com/maps/search/indian+grocery+store+near+me" target="_blank" rel="noopener">Find Indian stores near you</a>`;
}

/* ================= Sheet ================= */
function sheet(html){ $("#sheetIn").innerHTML = `<div class="grab"></div>${html}`; $("#sheet").hidden = false; }
function closeSheet(){ $("#sheet").hidden = true; }

/* ================= Guided puja ================= */
let step = 0, lock = null;
const pujaSteps = () => RIT ? RIT.steps.map(x=>({t:x.t || "", do:x.d || "", why:x.w || "", items:x.i || "", audio:x.audio || ""})) : (S.pujaLen === "short" ? STEPS.filter(s=>s.core) : STEPS);
function startSheet(){
  const skipped = STEPS.filter(s=>!s.core).map(s=>s.t).join(", ");
  sheet(`<h2>Lakshmi puja</h2>
    <div class="stack" style="gap:8px">
      <button class="choice" aria-pressed="${S.pujaLen==="full"}" data-act="plen" data-v="full"><b>Full puja</b><span class="small muted">${STEPS.length} steps · about 40 minutes</span></button>
      <button class="choice" aria-pressed="${S.pujaLen==="short"}" data-act="plen" data-v="short"><b>Short puja</b><span class="small muted">${STEPS.filter(s=>s.core).length} steps · about 15 minutes · skips ${skipped}</span></button>
    </div>
    <div class="toggle"><div><div class="t-title">Guide me aloud</div><div class="sub">Each step is read out to you. This preview uses your phone's voice; the full app will have a priest's recording of the mantras.</div></div>${sw(S.aloud,"aloud",'aria-label="Guide me aloud"')}</div>
    <button class="btn primary block" data-act="begin">Begin the puja</button>`);
}
function openPuja(){ closeSheet(); step = 0; $("#puja").hidden = false; document.body.style.overflow="hidden"; renderPuja();
  try{ navigator.wakeLock && navigator.wakeLock.request("screen").then(l=>lock=l).catch(()=>{}); }catch(e){} }
function closePuja(){ RIT = null; stopSpeak(); $("#puja").hidden = true; document.body.style.overflow=""; try{ lock && lock.release(); }catch(e){} lock=null; }
function stepText(s){ return s.t + ". " + s.do + (s.m ? " Now say the mantra shown on screen." : ""); }
function renderPuja(){
  const L = pujaSteps(), N = L.length, end = step >= N;
  const s = L[Math.min(step,N-1)];
  const fam = S.notes.filter(n => n.where === s.t);
  const m = s.m ? `<div class="mantra"><span class="lab">Say</span>${S.lang!=="en"?`<div class="script ${S.lang==="kn"?"kn":""}">${S.lang==="kn"?s.m.kn:s.m.dv}</div>`:""}<div class="tr">${s.m.tr}</div></div>` : "";
  $("#puja").innerHTML = `<div class="wrap">
    <div class="top"><div class="bar" aria-hidden="true">${L.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div><button class="pbtn" data-act="close">Close</button></div>
    ${end && RIT ? `<div class="scroll" style="justify-content:center;text-align:center;align-items:center">${diya(140)}<h2>${esc(RIT.title)}</h2><p class="do">Done, the way ${esc(RIT.by)} does it.</p><button class="btn" style="background:var(--brass);color:#2A1E07" data-act="close">Back to the family</button></div>` : end ? `<div class="scroll" style="justify-content:center;text-align:center;align-items:center">${diya(140)}<h2>Shubha Deepavali</h2><p class="do">Lakshmi puja is complete. Share the prasada and enjoy the evening with your family.</p>
      <div class="react" id="react"><p><b>Was this how your family does it?</b></p><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="pbtn" data-act="react" data-v="yes">Yes</button><button class="pbtn" data-act="react" data-v="mostly">Mostly</button><button class="pbtn" data-act="react" data-v="different">Quite different</button></div></div>
      <button class="btn" style="background:var(--brass);color:#2A1E07" data-act="close">Back to the plan</button></div>` : `
    <div class="scroll">
      ${step===0?diya(90):""}
      <div class="num">Step ${step+1} of ${N} · ${RIT ? esc(RIT.title) + " · " + esc(RIT.by) + "'s way" : (S.pujaLen==="short"?"Short":"Full") + " Lakshmi puja"}</div>
      <h2>${RIT ? esc(s.t) : s.t}</h2>
      <p class="do">${RIT ? esc(s.do) : s.do}</p>
      ${m}
      ${RIT ? ritExtras(s) : ""}
      ${s.why ? `<p class="why"><b>Why · </b>${RIT ? esc(s.why) : s.why}</p>` : ""}
      ${fam.map(n=>`<div class="fnote"><div class="who">${esc(n.who)}'s way</div>${esc(n.text)}</div>`).join("")}
      <div class="tools">
        <button class="pbtn" data-act="listen">Listen</button>
        <button class="pbtn" aria-pressed="${S.aloud}" data-act="aloud2">Guide me aloud</button>
        ${RIT ? "" : `<button class="pbtn" data-act="missing">Missing an item?</button>`}
        <button class="pbtn" data-act="ask" data-q="How do we do ${esc(s.t)} at home?">Ask an elder</button>
      </div>
    </div>
    <div class="nav"><button class="prev" data-act="prev" ${step===0?"disabled style='opacity:.4'":""}>Back</button><button class="next" data-act="next">${step===N-1?"Finish":"Next step"}</button></div>
    <p class="hint">Screen stays on · in the app, say “next”, “repeat” or “why” · here, use the arrow keys</p>`}
  </div>`;
  if(!end && S.aloud) speak(stepText(s)); else if(end) stopSpeak();
}
function missingSheet(){
  sheet(`<h2>Missing an item?</h2><p class="small muted">These substitutes are accepted in many homes. If your family has a rule, follow that.</p>
    <div class="card" style="padding:12px"><table class="t">${SUBS.map(([a,b])=>`<tr><th style="width:38%;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink)">${a}</th><td>${b}</td></tr>`).join("")}</table></div>
    <button class="btn ghost block" data-act="closesheet">Back to the puja</button>`);
}

/* ================= Events ================= */
let vnTimer = null;
document.addEventListener("click", e => {
  if(e.target.id === "sheet"){ closeSheet(); return; }
  const g = e.target.closest("[data-go]"); if(g){ closeSheet(); if(!$("#puja").hidden) closePuja(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if(!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch(act){
    case "task": S.tasks[id] = !S.tasks[id]; save(); rerender(); break;
    case "item": S.items[id] = !S.items[id]; save(); rerender(); break;
    case "griha": S.griha[id] = !S.griha[id]; save(); rerender(); break;
    case "assign": { const c = S.assign[id]; const n = c===undefined ? 0 : c+1; if(n>=MEMBERS.length) delete S.assign[id]; else S.assign[id]=n; save(); rerender(); break; }
    case "variant": S.opts[a.dataset.k] = !S.opts[a.dataset.k]; save(); rerender(); break;
    case "way": S.ways[a.dataset.k] = a.dataset.v; save(); rerender(); toast("Plan updated"); break;
    case "filter": S.samView = a.dataset.v; save(); rerender(); break;
    case "order": orderSheet(); break;
    case "store": orderSheet(a.dataset.v); break;
    case "place": closeSheet(); toast("Preview: no order is placed"); break;
    case "puja": startSheet(); break;
    case "plen": S.pujaLen = a.dataset.v; save(); startSheet(); break;
    case "aloud": S.aloud = !S.aloud; save(); startSheet(); break;
    case "begin": track("puja-start-" + S.pujaLen + (S.aloud ? "-aloud" : "")); openPuja(); break;
    case "close": closePuja(); break;
    case "next": step++; if(step === pujaSteps().length) track("puja-complete"); renderPuja(); break;
    case "prev": if(step>0){ step--; renderPuja(); } break;
    case "listen": speak(stepText(pujaSteps()[step])); break;
    case "aloud2": S.aloud = !S.aloud; save(); if(!S.aloud) stopSpeak(); renderPuja(); break;
    case "missing": missingSheet(); break;
    case "closesheet": closeSheet(); break;
    case "ask": askSheet(a.dataset.q); break;
    case "sendask": {
      const to=$("#ato").value, where=$("#awhere").value, q=$("#aq").value.trim(); if(!q){ toast("Write the question first"); return; }
      S.asks.unshift({id:"q"+Date.now(), to, where, q}); save(); closeSheet();
      const link = document.createElement("a"); link.href = "https://wa.me/?text=" + encodeURIComponent(q + "\n\n(Sent from Vidhi-Vidhan)"); link.target="_blank"; link.rel="noopener"; document.body.appendChild(link); link.click(); link.remove();
      toast("Question saved. Replies will appear in Family."); if(route()==="family") rerender(); break; }
    case "simreply": { const q = S.asks.find(x=>x.id===id); q.reply = {len:"0:31", text:"Yes, a small coin, some akshata and a flower go inside. Your Ajji used a silver coin from her wedding."}; S.notes.push({id:"n"+Date.now(), who:q.to, where:q.where, text:q.reply.text}); save(); rerender(); toast("Reply saved to the step"); break; }
    case "play": {
      const box = document.querySelector(`[data-vn="${id}"]`); const bars = box.querySelectorAll(".wave i"); let i = 0; clearInterval(vnTimer);
      bars.forEach(b=>b.classList.remove("on"));
      vnTimer = setInterval(()=>{ if(i>=bars.length){ clearInterval(vnTimer); return; } bars[i++].classList.add("on"); }, 120);
      const q = S.asks.find(x=>x.id===id); speak(q.reply.text); break; }
    case "invite": toast("Invites come in the full app"); break;
    case "addnote": { const text = $("#ntext").value.trim(); if(!text){ toast("Write the note first"); return; }
      S.notes.push({id:"n"+Date.now(), who:$("#nwho").value, where:$("#nwhere").value, text}); save(); rerender(); toast("Note saved for the family"); break; }
    case "share": {
      const txt = "Lakshmi puja samagri\n" + SAMAGRI.concat(S.extra.length?[{group:"From recipes",items:S.extra}]:[]).map(g=>g.group+":\n"+g.items.filter(i=>!S.items[i.id]).map(i=>"- "+i.n+" ("+i.q+")").join("\n")).join("\n");
      try{ navigator.clipboard.writeText(txt).then(()=>toast("List copied"), ()=>toast("Copy isn't available here")); }catch(err){ toast("Copy isn't available here"); } break; }
    case "restart": S.onboarded=false; obStep=0; save(); go("welcome"); break;
    case "ob-next": { const f=$("#famIn"); if(f) S.famNote=f.value.trim().slice(0,120); } if(obStep===0){ const n=$("#nameIn"); if(n) S.name=n.value.trim().slice(0,30); } if(obStep>=3){ track("onboard-" + S.region + "-" + S.practice); S.onboarded=true; S.tourDone=false; save(); obStep=0; go("home"); } else { obStep++; render(); } break;
    case "ob-back": obStep=Math.max(0,obStep-1); render(); break;
    case "ob-pick": S[a.dataset.key]=a.dataset.val; if(a.dataset.key === "region"){ S.st = ST_OF_REGION[S.region] || S.st; syncRegion(); } save(); render(); break;
    case "ob-skip": { const n=$("#nameIn"); if(n) S.name=n.value.trim().slice(0,30); } S.region="karnataka"; S.st="KA"; S._reg="karnataka"; S.practice="home"; S.onboarded=true; S.tourDone=false; save(); obStep=0; go("home"); break;
    case "tour": if(route()!=="home") go("home"); setTimeout(startTour, 60); track("tour-replay"); break;
    case "tipok": S.tips = S.tips || {}; S.tips[a.dataset.k] = true; save(); rerender(); break;
    case "react": { const v = a.dataset.v; track("puja-react-" + v); const box = $("#react");
      box.innerHTML = v === "different" ? `<p><b>Thank you. That's exactly what we need to hear.</b></p><p class="small" style="color:var(--night-muted)">Tell us how your family does it, or ask an elder and save their way.</p><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="pbtn" data-act="feedback">Tell us</button><button class="pbtn" data-act="ask" data-q="How do we do the Lakshmi puja at home?">Ask an elder</button></div>` : `<p><b>Thank you!</b> That helps us get every tradition right.</p>`; break; }
    case "feedback": track("feedback-open"); if(FORM_URL){ const l=document.createElement("a"); l.href=FORM_URL; l.target="_blank"; l.rel="noopener"; document.body.appendChild(l); l.click(); l.remove(); } else sheet(`<h2>Tell us what you think</h2><p class="muted">The feedback form opens in a day or two. Meanwhile, join the early list on the website and we'll ask you there.</p><a class="btn primary block" href="../#join" style="text-decoration:none">Go to the website</a><button class="btn ghost block" data-act="closesheet">Keep exploring</button>`); break;
    case "pfilter": S.priestFilter = a.dataset.v; save(); rerender(); break;
    case "book": bookSheet(Number(a.dataset.i)); break;
    case "sendbook": closeSheet(); toast("Preview: no request is sent"); break;
    case "vrat": S.vrats[a.dataset.k] = !S.vrats[a.dataset.k]; save(); rerender(); break;
    case "addshraddha": { const n = $("#sname").value.trim(); if(!n){ toast("Add a name first"); return; }
      S.shraddha.push({n, masa:$("#smasa").value, paksha:$("#spaksha").value, tithi:$("#stithi").value, next:"worked out from the panchang"}); save(); rerender(); toast("Saved. You'll be reminded each year."); break; }
    case "serv": { const r = RECIPES.find(x=>x.id===id); S.servings[id] = Math.max(r.base/2, S.servings[id] + Number(a.dataset.d)); save(); rerender(); break; }
    case "addrecipe": { const r = RECIPES.find(x=>x.id===id), k = S.servings[id]/r.base; let added=0;
      r.ing.forEach(([x,v,u])=>{ const iid = "x-"+id+"-"+x; if(!S.extra.find(e=>e.id===iid)){ S.extra.push({id:iid, n:x, q:fmtQty(v*k,u), sub:"For "+r.n, p:Math.max(20,Math.round(v*k/5)*5)}); added++; } });
      save(); toast(added ? `${added} ingredients added to Samagri` : "Already on your list"); break; }
    case "rnext": rStep = rStep===3 ? 0 : rStep+1; rerender(); break;
    case "rprev": rStep = Math.max(0,rStep-1); rerender(); break;
    case "story": story = a.dataset.k; sPage = 0; stopSpeak(); if(route()!=="stories") go("stories"); else render(); break;
    case "storyclose": story = null; stopSpeak(); render(); break;
    case "snext": { const st = STORIES[story]; if(sPage < st.pages.length-1){ sPage++; } else { story=null; } stopSpeak(); render(); break; }
    case "sprev": sPage = Math.max(0,sPage-1); stopSpeak(); render(); break;
    case "sread": speak(STORIES[story].pages[sPage]); break;
    case "nri": S.nri.on = !S.nri.on; save(); rerender(); toast(S.nri.on?"Abroad mode on":"Abroad mode off"); break;
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "ncity"){ S.nri.city = e.target.value; save(); rerender(); }
});
document.addEventListener("input", e => {
  const i = e.target.dataset && e.target.dataset.budget; if(i===undefined) return;
  S.budget[Number(i)][1] = Number(e.target.value) || 0; save();
  const t = $("#btotal"); if(t) t.textContent = rupee(S.budget.reduce((s,b)=>s+Number(b[1]||0),0));
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && !$("#sheet").hidden){ closeSheet(); return; }
  if($("#puja").hidden || !$("#sheet").hidden) return;
  if(e.key==="ArrowRight"){ if(step<pujaSteps().length){ step++; renderPuja(); } }
  else if(e.key==="ArrowLeft"){ if(step>0){ step--; renderPuja(); } }
  else if(e.key==="Escape") closePuja();
});
render();
</script>
