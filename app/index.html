<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Vidhi-Vidhan App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gotu&family=Hind:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;600&display=swap">
<style>
/* Layout: a single phone-width app column, centred on wide screens; bottom tab bar; sheets slide up from the bottom; guided puja takes over the full screen in night colours. */
:root{
  --ground:#F2F4EC; --surface:#FFFFFF; --ink:#1C231E; --muted:#5D695F; --line:#D9DED2;
  --leaf:#2E6A3E; --leaf-soft:#E2EDE0; --haldi:#C98A06; --haldi-soft:#FAEFCF; --kumkum:#AE1530; --kumkum-soft:#F8E1E4;
  --scrim:rgba(20,24,20,.45);
  --night:#15110C; --brass:#E9B850; --brass-dim:#9C7B3A; --night-ink:#F4EBDD; --night-muted:#B8A88E;
  --display:"Gotu", "Hind", Georgia, serif;
  --body:"Hind", "Noto Sans Kannada", system-ui, sans-serif;
  --kn:"Noto Sans Kannada", "Hind", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#111511; --surface:#1A201B; --ink:#E8ECE4; --muted:#9BA69D; --line:#2B332D;
  --leaf:#7DC28F; --leaf-soft:#1E3325; --haldi:#F0BA3D; --haldi-soft:#3A2D10; --kumkum:#F0687E; --kumkum-soft:#3C1A20; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#111511; --surface:#1A201B; --ink:#E8ECE4; --muted:#9BA69D; --line:#2B332D;
  --leaf:#7DC28F; --leaf-soft:#1E3325; --haldi:#F0BA3D; --haldi-soft:#3A2D10; --kumkum:#F0687E; --kumkum-soft:#3C1A20; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--leaf)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--haldi);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-block:20px 104px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.row{display:flex;align-items:center;gap:12px}
.wrap-row{display:flex;flex-wrap:wrap;gap:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.between{justify-content:space-between}
.proto{font-size:.75rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.proto button{background:none;border:0;padding:0;color:var(--leaf);text-decoration:underline;font-size:.75rem}
.back{background:none;border:0;padding:0;color:var(--leaf);font-weight:600;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.sample{display:inline-block;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}

.fest{background:var(--leaf);color:#F6F3E6;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.fest .eyebrow{color:#CFE3CF}
.fest .count{font-family:var(--display);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--brass)}
.fest .lamps{position:absolute;right:-6px;top:14px;opacity:.9}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 6px;text-align:center;font-size:.75rem;line-height:1.3}
.day b{display:block;font-size:.95rem;font-weight:600}
.day.main{background:var(--brass);color:#2A1E07}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--kumkum);color:#fff}
.btn.green{background:var(--leaf);color:var(--surface)}
.btn.light{background:#FFF8E6;color:#1C231E}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:.88rem}
.btn.block{width:100%}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{background:none;border:0;padding:0;color:var(--leaf);font-weight:600;font-size:.9rem;text-align:left}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task:last-child{padding-bottom:0}
.check{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;margin-top:2px}
.check[aria-checked="true"]{background:var(--leaf);border-color:var(--leaf)}
.check svg{opacity:0}
.check[aria-checked="true"] svg{opacity:1}
.task.done .t-title,.item.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-title{font-weight:600}
.t-body{font-size:.9rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;border-radius:999px;padding:3px 10px;border:0}
.chip.time{background:var(--haldi-soft);color:var(--ink)}
.chip.family{background:var(--kumkum-soft);color:var(--ink)}
.chip.today{background:var(--leaf);color:var(--surface)}
.chip.who{background:var(--leaf-soft);color:var(--ink)}
.chip.assign{background:transparent;border:1px dashed var(--line);color:var(--muted)}
button.chip{cursor:pointer}

.tl-day{display:grid;grid-template-columns:56px 1fr;gap:12px;position:relative}
.tl-date{text-align:center;padding-top:2px}
.tl-date .d{font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.tl-date .w{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tl-day::before{content:"";position:absolute;left:27px;top:44px;bottom:-4px;width:1.5px;background:var(--line)}
.tl-day:last-child::before{display:none}
.tl-body{padding-bottom:20px;min-width:0}
.tl-day.fest-day .tl-date .d{color:var(--kumkum)}
.note{background:var(--kumkum-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.note .who{font-weight:600;font-size:.8rem}

.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0;padding-top:0}
.switch{flex:none;width:44px;height:26px;border-radius:99px;border:0;background:var(--line);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .2s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{left:21px}

.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--leaf);transition:width .3s}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.item:last-child{padding-bottom:0}
.item .qty{margin-left:auto;font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.sub{font-size:.8rem;color:var(--muted)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 10px;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--leaf-soft);color:var(--ink)}

.ob{display:flex;flex-direction:column;gap:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.opt b{font-weight:600}
.opt span{font-size:.8rem;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:24px;height:4px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--leaf)}
.kn{font-family:var(--kn)}

.member{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--haldi-soft);color:var(--ink);flex:none;font-size:.9rem}
textarea,select,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
textarea{min-height:80px;resize:vertical}
label.lbl{font-size:.85rem;font-weight:600;display:block;margin-bottom:6px}

/* Compare two family ways */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;font-size:.85rem;display:flex;flex-direction:column;gap:4px;min-width:0}
.side b{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.side[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

/* Voice note */
.vn{display:flex;align-items:center;gap:10px;background:var(--leaf-soft);border-radius:999px;padding:6px 14px 6px 6px}
.vn button{width:34px;height:34px;border-radius:50%;border:0;background:var(--leaf);color:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.vn .wave{flex:1;height:22px;display:flex;align-items:center;gap:2px}
.vn .wave i{flex:1;background:var(--muted);border-radius:2px;opacity:.5}
.vn .wave i.on{background:var(--leaf);opacity:1}
.vn .len{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* More grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:26px;height:26px;color:var(--leaf)}
.tile b{font-weight:600;line-height:1.25}
.tile span{font-size:.8rem;color:var(--muted);line-height:1.35}

table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t td,table.t th{padding:8px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t tr:first-child td,table.t tr:first-child th{border-top:0}
table.t th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right!important;white-space:nowrap}
.budget input{text-align:right;padding:6px 8px;width:110px;font-variant-numeric:tabular-nums}

.story{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:300px}
.story p.page{font-family:var(--display);font-size:1.25rem;line-height:1.5}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:600;color:var(--muted);padding:6px 0}
nav.tabs button[aria-current="page"]{color:var(--leaf)}
nav.tabs svg{width:22px;height:22px}

/* Bottom sheet */
.sheet{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);color:var(--ink);width:100%;max-width:480px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:20px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-in .grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.choice[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

/* Guided puja mode */
.puja{position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 100%, #3A2A12 0%, var(--night) 60%);color:var(--night-ink);z-index:20;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));color-scheme:dark}
.puja .wrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;gap:14px}
.puja .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pbtn{background:rgba(255,255,255,.08);border:0;border-radius:999px;padding:8px 14px;color:var(--night-ink);font-size:.85rem;font-weight:600}
.pbtn[aria-pressed="true"]{background:var(--brass);color:#2A1E07}
.puja .bar{display:flex;gap:4px;flex:1}
.puja .bar i{flex:1;height:3px;border-radius:3px;background:rgba(233,184,80,.22)}
.puja .bar i.on{background:var(--brass)}
.puja .scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:18px;min-height:0;padding-bottom:8px}
.puja .num{font-family:var(--display);color:var(--brass);font-size:.95rem;text-align:left!important}
.puja h2{font-size:2rem;color:#FFF5E0}
.puja .do{font-size:1.2rem;line-height:1.55}
.mantra{border:1px solid rgba(233,184,80,.35);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;background:rgba(233,184,80,.06)}
.mantra .script{font-size:1.45rem;line-height:1.5;color:#FFF1CF}
.mantra .tr{font-style:italic;color:var(--night-muted)}
.mantra .lab{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.why{color:var(--night-muted);font-size:.98rem;border-left:2px solid var(--brass-dim);padding-left:12px}
.why b{color:var(--brass);font-weight:600}
.puja .fnote{background:rgba(240,104,126,.12);border-radius:12px;padding:10px 12px;font-size:.95rem}
.puja .fnote .who{font-weight:600;color:#F7B3BE;font-size:.8rem}
.puja .tools{display:flex;gap:8px;flex-wrap:wrap}
.puja .nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.puja .nav button{border:0;border-radius:999px;padding:16px;font-weight:600;font-size:1rem}
.puja .prev{background:rgba(255,255,255,.08);color:var(--night-ink)}
.puja .next{background:var(--brass);color:#2A1E07}
.puja .hint{text-align:center;font-size:.75rem;color:var(--night-muted)}
.diya{display:block;margin:0 auto}
.flame{transform-origin:50% 100%;animation:flick 2.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) rotate(-1deg)}50%{transform:scaleY(1.08) rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){.flame{animation:none}.progress span,.switch::after{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:40;max-width:90%;text-align:center}
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Main">
  <div class="in">
    <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3c-2 3-3 4.5-3 6.5a3 3 0 0 0 6 0C15 7.5 14 6 12 3z"/><path d="M4 15h16l-2 5H6z"/></svg>Today</button>
    <button data-go="prepare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Prepare</button>
    <button data-go="samagri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14l-1.5 12h-11z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Samagri</button>
    <button data-go="family"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.3"/><path d="M3 20c.5-3.5 3-5.5 6-5.5s5.5 2 6 5.5M15 15.5c2.5-.3 5 1 5.5 4.5"/></svg>Family</button>
    <button data-go="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>More</button>
  </div>
</nav>
<div id="puja" class="puja" hidden></div>
<div id="sheet" class="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true"></div></div>

<script>
/* ================= Content (sample: Rao family, Kannada Smartha, Bengaluru) ================= */
const FEST = {name:"Deepavali", mainDate:"2026-11-08", days:[
  {date:"2026-11-06", w:"Fri", label:"Neeru tumbuva"},
  {date:"2026-11-07", w:"Sat", label:"Naraka Chaturdashi"},
  {date:"2026-11-08", w:"Sun", label:"Lakshmi puja", main:true},
  {date:"2026-11-09", w:"Mon", label:"Bali Padyami"}]};

const MEMBERS = [
  {n:"Anand", r:"You · Bengaluru", i:"An"},
  {n:"Kavya", r:"Spouse · grew up in a Tamil Iyer family", i:"K"},
  {n:"Meera", r:"Sister · Pune", i:"M"},
  {n:"Amma", r:"Mysuru · keeper of the family way", i:"A"}
];

const PLAN = [
  {date:"2026-10-31", w:"Sat", title:"Clean and set up", tasks:[
    {id:"t1", t:"Deep-clean the house and puja room", b:"Start with the puja shelf and the entrance."},
    {id:"t2", t:"Polish the brass lamps and vessels", b:"Tamarind and a little salt brings back the shine on brass."},
    {id:"t3", t:"Wash the bathing vessel (hande)", b:"You will decorate and fill it on Friday evening.", opt:"neeru"}]},
  {date:"2026-11-02", w:"Mon", title:"Shopping", tasks:[
    {id:"t4", t:"Buy everything on the samagri list", b:"Flowers and fruits come later; buy the rest now.", link:"samagri"},
    {id:"t5", t:"Buy earthen diyas and wicks", b:"Soak new diyas in water overnight so they don't drink the oil."},
    {id:"t6", t:"New clothes for the family", b:"Worn after the oil bath."}]},
  {date:"2026-11-05", w:"Thu", title:"Sweets and snacks", tasks:[
    {id:"t7", t:"Make karjikai and chakli", b:"Both keep well for a week.", recipe:true},
    {id:"t7b", t:"Make Mysore pak and murukku", b:"From Kavya's side of the family.", side:"sweets"}]},
  {date:"2026-11-06", w:"Fri", title:"Neeru tumbuva habba", fest:true, tasks:[
    {id:"t8", t:"Decorate the bathing vessel", b:"Draw rangoli, apply haldi and kumkum, tie a garland around its neck.", time:"Evening", opt:"neeru"},
    {id:"t9", t:"Fill it with fresh water", b:"This water is used for tomorrow's oil bath.", time:"After sunset", opt:"neeru"},
    {id:"t10", t:"Buy flowers, fruits and betel leaves", b:"Fresh for the weekend."},
    {id:"t10b", t:"Draw the Deepavali rangoli", b:"A 7-dot diya design takes about 20 minutes.", rangoli:true}]},
  {date:"2026-11-07", w:"Sat", title:"Naraka Chaturdashi", fest:true, tasks:[
    {id:"t11", t:"Oil bath before sunrise (abhyanga snana)", b:"An elder applies warm oil on each person's head before the bath.", time:"Before ~6:15 AM", noteWhere:"Oil bath"},

/* ================= Rangoli ================= */
let rStep = 0;
function rangoliSVG(layer){
  const pts=[]; for(let y=0;y<7;y++) for(let x=0;x<7;x++) pts.push([30+x*30,30+y*30]);
  const dots = pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="var(--muted)"/>`).join("");
  const outline = `<path d="M120 30L210 120L120 210L30 120Z" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="120" cy="120" r="48" fill="none" stroke="var(--ink)" stroke-width="2.5"/>`;
  const petals = [0,90,180,270].map(a=>`<ellipse cx="120" cy="56" rx="14" ry="22" transform="rotate(${a} 120 120)" fill="${layer>=4?"var(--kumkum)":"none"}" fill-opacity=".85" stroke="var(--ink)" stroke-width="2"/>`).join("") + [45,135,225,315].map(a=>`<ellipse cx="120" cy="64" rx="9" ry="15" transform="rotate(${a} 120 120)" fill="${layer>=4?"var(--haldi)":"none"}" stroke="var(--ink)" stroke-width="2"/>`).join("");
  const lamp = `<path d="M96 126h48c-2 12-12 20-24 20s-22-8-24-20z" fill="${layer>=4?"#B8742A":"none"}" stroke="var(--ink)" stroke-width="2.5"/><path d="M120 92c-7 10-8 14-8 18a8 8 0 0 0 16 0c0-4-1-8-8-18z" fill="${layer>=4?"var(--haldi)":"none"}" stroke="var(--ink)" stroke-width="2.5"/>`;
  const fill = layer>=4?`<circle cx="120" cy="120" r="46" fill="var(--leaf)" fill-opacity=".25"/>`:"";
  return `<svg viewBox="0 0 240 240" width="100%" style="max-width:300px;display:block;margin:0 auto" role="img" aria-label="Diya rangoli, step ${layer}">${fill}${layer>=2?outline:""}${layer>=3?petals+lamp:""}${dots}</svg>`;
}
function viewRangoli(){
  const steps = [
    ["Place the dots","Make a 7 by 7 grid of dots, about two fingers apart. Start from the centre dot so the design stays even."],
    ["Draw the frame","Join the middle dot of each edge to make a diamond. Draw a circle around the centre, passing between the inner dots."],
    ["Add the diya and petals","Draw the diya in the centre: a bowl, then the flame. Add four large petals on the diamond's points and four small ones between them."],
    ["Fill in the colours","Red for the large petals, yellow for the small ones and the flame, green inside the circle. Outline again in white at the end."]
  ];
  const s = steps[rStep];
  return `${back()}
    <div class="stack" style="gap:6px"><p class="eyebrow">Rangoli · beginner · 20 min</p><h1>Diya rangoli, 7 dots</h1></div>
    <div class="card stack">${rangoliSVG(rStep+1)}
      <div class="dots" style="justify-content:center">${steps.map((_,i)=>`<i class="${i<=rStep?"on":""}"></i>`).join("")}</div>
      <h3>${rStep+1}. ${s[0]}</h3><p>${s[1]}</p>
      <div class="row"><button class="btn ghost" data-act="rprev" ${rStep===0?"disabled":""}>Back</button><button class="btn green" style="flex:1" data-act="rnext">${rStep===3?"Start again":"Next step"}</button></div>
    </div>
    <p class="small muted">More designs for each festival come in the full app, including padi kolam for Tamil households.</p>`;
}

function sheet(html){ $("#sheetIn").innerHTML = `<div class="grab"></div>${html}`; $("#sheet").hidden = false; }

/* ================= Guided puja ================= */
let step = 0, lock = null;
const pujaSteps = () => S.pujaLen === "short" ? STEPS.filter(s=>s.core) : STEPS;
function startSheet(){
  const skipped = STEPS.filter(s=>!s.core).map(s=>s.t).join(", ");
  sheet(`<h2>Lakshmi puja</h2>
    <div class="stack" style="gap:8px">
      <button class="choice" aria-pressed="${S.pujaLen==="full"}" data-act="plen" data-v="full"><b>Full puja</b><span class="small muted">${STEPS.length} steps · about 40 minutes</span></button>
      <button class="choice" aria-pressed="${S.pujaLen==="short"}" data-act="plen" data-v="short"><b>Short puja</b><span class="small muted">${STEPS.filter(s=>s.core).length} steps · about 15 minutes · skips ${skipped}</span></button>
    </div>
    <div class="toggle"><div><div class="t-title">Guide me aloud</div><div class="sub">Each step and its mantra are read out. Repeat after the voice.</div></div>${sw(S.aloud,"aloud",'aria-label="Guide me aloud"')}</div>
    <button class="btn primary block" data-act="begin">Begin the puja</button>`);
}
function openPuja(){ closeSheet(); step = 0; $("#puja").hidden = false; document.body.style.overflow="hidden"; renderPuja();
  try{ navigator.wakeLock && navigator.wakeLock.request("screen").then(l=>lock=l).catch(()=>{}); }catch(e){} }
function closePuja(){ stopSpeak(); $("#puja").hidden = true; document.body.style.overflow=""; try{ lock && lock.release(); }catch(e){} lock=null; }
function stepText(s){ return s.t + ". " + s.do + (s.m ? " Repeat after me. " + s.m.tr : ""); }
function renderPuja(){
  const L = pujaSteps(), N = L.length, end = step >= N;
  const s = L[Math.min(step,N-1)];
  const fam = S.notes.filter(n => n.where === s.t);
  const m = s.m ? `<div class="mantra"><span class="lab">Say</span>${S.lang!=="en"?`<div class="script ${S.lang==="kn"?"kn":""}">${S.lang==="kn"?s.m.kn:s.m.dv}</div>`:""}<div class="tr">${s.m.tr}</div></div>` : "";
  $("#puja").innerHTML = `<div class="wrap">
    <div class="top"><div class="bar" aria-hidden="true">${L.map((_,i)=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div><button class="pbtn" data-act="close">Close</button></div>
    ${end ? `<div class="scroll" style="justify-content:center;text-align:center;align-items:center">${diya(140)}<h2>Shubha Deepavali</h2><p class="do">Lakshmi puja is complete. Share the prasada and enjoy the evening with your family.</p><button class="btn" style="background:var(--brass);color:#2A1E07" data-act="close">Back to the plan</button></div>` : `
    <div class="scroll">
      ${step===0?diya(90):""}
      <div class="num">Step ${step+1} of ${N} · ${S.pujaLen==="short"?"Short":"Full"} Lakshmi puja</div>
      <h2>${s.t}</h2>
      <p class="do">${s.do}</p>
      ${m}
      <p class="why"><b>Why · </b>${s.why}</p>
      ${fam.map(n=>`<div class="fnote"><div class="who">${esc(n.who)}'s way</div>${esc(n.text)}</div>`).join("")}
      <div class="tools">
        <button class="pbtn" data-act="listen">Listen</button>
        <button class="pbtn" aria-pressed="${S.aloud}" data-act="aloud2">Guide me aloud</button>
        <button class="pbtn" data-act="missing">Missing an item?</button>
        <button class="pbtn" data-act="ask" data-q="How do we do ${esc(s.t)} at home?">Ask an elder</button>
      </div>
    </div>
    <div class="nav"><button class="prev" data-act="prev" ${step===0?"disabled style='opacity:.4'":""}>Back</button><button class="next" data-act="next">${step===N-1?"Finish":"Next step"}</button></div>
    <p class="hint">Screen stays on · in the app, say “next”, “repeat” or “why” · here, use the arrow keys</p>`}
  </div>`;
  if(!end && S.aloud) speak(stepText(s)); else if(end) stopSpeak();
}
function missingSheet(){
  sheet(`<h2>Missing an item?</h2><p class="small muted">These substitutes are accepted in many homes. If your family has a rule, follow that.</p>
    <div class="card" style="padding:12px"><table class="t">${SUBS.map(([a,b])=>`<tr><th style="width:38%;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink)">${a}</th><td>${b}</td></tr>`).join("")}</table></div>

}

/* ================= Events ================= */
let vnTimer = null;
document.addEventListener("click", e => {
  if(e.target.id === "sheet"){ closeSheet(); return; }
  const g = e.target.closest("[data-go]"); if(g){ closeSheet(); if(!$("#puja").hidden) closePuja(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if(!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  switch(act){
    case "task": S.tasks[id] = !S.tasks[id]; save(); rerender(); break;
    case "item": S.items[id] = !S.items[id]; save(); rerender(); break;
    case "griha": S.griha[id] = !S.griha[id]; save(); rerender(); break;
    case "assign": { const c = S.assign[id]; const n = c===undefined ? 0 : c+1; if(n>=MEMBERS.length) delete S.assign[id]; else S.assign[id]=n; save(); rerender(); break; }
    case "variant": S.opts[a.dataset.k] = !S.opts[a.dataset.k]; save(); rerender(); break;
    case "way": S.ways[a.dataset.k] = a.dataset.v; save(); rerender(); toast("Plan updated"); break;
    case "filter": S.samView = a.dataset.v; save(); rerender(); break;
    case "order": orderSheet(); break;
    case "store": orderSheet(a.dataset.v); break;
    case "place": closeSheet(); toast("Preview: no order is placed"); break;
    case "puja": startSheet(); break;
    case "plen": S.pujaLen = a.dataset.v; save(); startSheet(); break;
    case "aloud": S.aloud = !S.aloud; save(); startSheet(); break;
    case "begin": openPuja(); break;
    case "close": closePuja(); break;
    case "next": step++; renderPuja(); break;
    case "prev": if(step>0){ step--; renderPuja(); } break;
    case "listen": speak(stepText(pujaSteps()[step])); break;
    case "aloud2": S.aloud = !S.aloud; save(); if(!S.aloud) stopSpeak(); renderPuja(); break;
    case "missing": missingSheet(); break;
    case "closesheet": closeSheet(); break;
    case "ask": askSheet(a.dataset.q); break;
    case "sendask": {
      const to=$("#ato").value, where=$("#awhere").value, q=$("#aq").value.trim(); if(!q){ toast("Write the question first"); return; }
      S.asks.unshift({id:"q"+Date.now(), to, where, q}); save(); closeSheet();
      const link = document.createElement("a"); link.href = "https://wa.me/?text=" + encodeURIComponent(q + "\n\n(Sent from Vidhi-Vidhan)"); link.target="_blank"; link.rel="noopener"; document.body.appendChild(link); link.click(); link.remove();
      toast("Question saved. Replies will appear in Family."); if(route()==="family") rerender(); break; }
    case "simreply": { const q = S.asks.find(x=>x.id===id); q.reply = {len:"0:31", text:"Yes, a small coin, some akshata and a flower go inside. Your Ajji used a silver coin from her wedding."}; S.notes.push({id:"n"+Date.now(), who:q.to, where:q.where, text:q.reply.text}); save(); rerender(); toast("Reply saved to the step"); break; }
    case "play": {
      const box = document.querySelector(`[data-vn="${id}"]`); const bars = box.querySelectorAll(".wave i"); let i = 0; clearInterval(vnTimer);
      bars.forEach(b=>b.classList.remove("on"));
      vnTimer = setInterval(()=>{ if(i>=bars.length){ clearInterval(vnTimer); return; } bars[i++].classList.add("on"); }, 120);
      const q = S.asks.find(x=>x.id===id); speak(q.reply.text); break; }
    case "invite": toast("Invites come in the full app"); break;
    case "addnote": { const text = $("#ntext").value.trim(); if(!text){ toast("Write the note first"); return; }
      S.notes.push({id:"n"+Date.now(), who:$("#nwho").value, where:$("#nwhere").value, text}); save(); rerender(); toast("Note saved for the family"); break; }
    case "share": {
      const txt = "Lakshmi puja samagri\n" + SAMAGRI.concat(S.extra.length?[{group:"From recipes",items:S.extra}]:[]).map(g=>g.group+":\n"+g.items.filter(i=>!S.items[i.id]).map(i=>"- "+i.n+" ("+i.q+")").join("\n")).join("\n");
      try{ navigator.clipboard.writeText(txt).then(()=>toast("List copied"), ()=>toast("Copy isn't available here")); }catch(err){ toast("Copy isn't available here"); } break; }
    case "restart": S.onboarded=false; obStep=0; save(); go("welcome"); break;
    case "ob-next": if(obStep>=3){ S.onboarded=true; save(); obStep=0; go("home"); } else { obStep++; render(); } break;
    case "ob-back": obStep=Math.max(0,obStep-1); render(); break;
    case "ob-pick": S[a.dataset.key]=a.dataset.val; save(); render(); break;
    case "ob-skip": S.onboarded=true; save(); obStep=0; go("home"); break;
    case "pfilter": S.priestFilter = a.dataset.v; save(); rerender(); break;
    case "book": bookSheet(Number(a.dataset.i)); break;
    case "sendbook": closeSheet(); toast("Preview: no request is sent"); break;
    case "vrat": S.vrats[a.dataset.k] = !S.vrats[a.dataset.k]; save(); rerender(); break;
    case "addshraddha": { const n = $("#sname").value.trim(); if(!n){ toast("Add a name first"); return; }
      S.shraddha.push({n, masa:$("#smasa").value, paksha:$("#spaksha").value, tithi:$("#stithi").value, next:"worked out from the panchang"}); save(); rerender(); toast("Saved. You'll be reminded each year."); break; }
    case "serv": { const r = RECIPES.find(x=>x.id===id); S.servings[id] = Math.max(r.base/2, S.servings[id] + Number(a.dataset.d)); save(); rerender(); break; }
    case "addrecipe": { const r = RECIPES.find(x=>x.id===id), k = S.servings[id]/r.base; let added=0;
      r.ing.forEach(([x,v,u])=>{ const iid = "x-"+id+"-"+x; if(!S.extra.find(e=>e.id===iid)){ S.extra.push({id:iid, n:x, q:fmtQty(v*k,u), sub:"For "+r.n, p:Math.max(20,Math.round(v*k/5)*5)}); added++; } });
      save(); toast(added ? `${added} ingredients added to Samagri` : "Already on your list"); break; }
    case "rnext": rStep = rStep===3 ? 0 : rStep+1; rerender(); break;
    case "rprev": rStep = Math.max(0,rStep-1); rerender(); break;
    case "story": story = a.dataset.k; sPage = 0; stopSpeak(); if(route()!=="stories") go("stories"); else render(); break;
    case "storyclose": story = null; stopSpeak(); render(); break;
    case "snext": { const st = STORIES[story]; if(sPage < st.pages.length-1){ sPage++; } else { story=null; } stopSpeak(); render(); break; }
    case "sprev": sPage = Math.max(0,sPage-1); stopSpeak(); render(); break;
    case "sread": speak(STORIES[story].pages[sPage]); break;
    case "nri": S.nri.on = !S.nri.on; save(); rerender(); toast(S.nri.on?"Abroad mode on":"Abroad mode off"); break;
  }
});
document.addEventListener("change", e => {
  if(e.target.id === "ncity"){ S.nri.city = e.target.value; save(); rerender(); }
});
document.addEventListener("input", e => {
  const i = e.target.dataset && e.target.dataset.budget; if(i===undefined) return;
  S.budget[Number(i)][1] = Number(e.target.value) || 0; save();
  const t = $("#btotal"); if(t) t.textContent = rupee(S.budget.reduce((s,b)=>s+Number(b[1]||0),0));
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape" && !$("#sheet").hidden){ closeSheet(); return; }
  if($("#puja").hidden || !$("#sheet").hidden) return;
  if(e.key==="ArrowRight"){ if(step<pujaSteps().length){ step++; renderPuja(); } }
  else if(e.key==="ArrowLeft"){ if(step>0){ step--; renderPuja(); } }
  else if(e.key==="Escape") closePuja();
});
render();
</script>
