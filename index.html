<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Vidhi-Vidhan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Every ritual, done your family's way. Festival plans, samagri lists and step-by-step pujas in your family's own tradition.">
<meta property="og:title" content="Vidhi-Vidhan: every ritual, done your family's way">
<meta property="og:description" content="Festival plans, samagri lists and step-by-step pujas in your family's tradition. Join the early list.">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gotu&family=Hind:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;600&display=swap">
<style>
/* Layout: full-width bands over a 1080px column. Hero: toran garland across the top, text left, phone right on a faint kolam. Bands alternate ground / surface / night, ending on a leaf-green call to action. */
:root{
  --ground:#F2F4EC; --surface:#FFFFFF; --ink:#1A211C; --muted:#56635A; --line:#D7DDD0;
  --leaf:#2E6A3E; --leaf-soft:#E0ECDD; --haldi:#C98A06; --haldi-soft:#FAEFCF; --kumkum:#AE1530; --kumkum-ink:#FFFFFF;
  --night:#16110B; --brass:#E9B850; --night-ink:#F4EBDD; --night-muted:#B9A98F;
  --bubble-in:#FFFFFF; --bubble-out:#DCEFD6; --kolam:#2E6A3E;
  --display:"Gotu","Hind",Georgia,serif; --body:"Hind",system-ui,sans-serif;
  --kn:"Noto Sans Kannada","Hind",sans-serif; --ta:"Noto Sans Tamil","Hind",sans-serif; --te:"Noto Sans Telugu","Hind",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#101410; --surface:#191F1A; --ink:#E8ECE4; --muted:#9DA89F; --line:#29312B;
  --leaf:#7DC28F; --leaf-soft:#1D3124; --haldi:#F0BA3D; --haldi-soft:#3A2D10; --kumkum:#E5506A; --kumkum-ink:#FFFFFF;
  --bubble-in:#1F2620; --bubble-out:#21402A; --kolam:#7DC28F; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#101410; --surface:#191F1A; --ink:#E8ECE4; --muted:#9DA89F; --line:#29312B;
  --leaf:#7DC28F; --leaf-soft:#1D3124; --haldi:#F0BA3D; --haldi-soft:#3A2D10; --kumkum:#E5506A; --kumkum-ink:#FFFFFF;
  --bubble-in:#1F2620; --bubble-out:#21402A; --kolam:#7DC28F; color-scheme:dark}
html[lang="kn"]{--display:"Noto Serif Kannada","Noto Sans Kannada",serif;--body:"Noto Sans Kannada","Hind",sans-serif}
html[lang="ta"]{--display:"Noto Serif Tamil","Noto Sans Tamil",serif;--body:"Noto Sans Tamil","Hind",sans-serif}
html[lang="te"]{--display:"Noto Serif Telugu","Noto Sans Telugu",serif;--body:"Noto Sans Telugu","Hind",sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
.in{max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.18;text-wrap:balance}
h1{font-size:clamp(2.4rem,6.2vw,4.4rem);letter-spacing:-.01em}
html[lang="kn"] h1,html[lang="ta"] h1,html[lang="te"] h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.3}
html[lang="ta"] h2{font-size:clamp(1.5rem,3vw,2.1rem)}
h2{font-size:clamp(1.8rem,3.6vw,2.6rem)}
h3{font-size:1.18rem;line-height:1.35}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--haldi);outline-offset:3px;border-radius:6px}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
html:not([lang="en"]) .eyebrow{letter-spacing:.02em;text-transform:none;font-size:.85rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px 22px;font-weight:600;font-size:1rem;text-decoration:none;border:0;cursor:pointer;font-family:inherit;line-height:1.25}
.btn.primary{background:var(--kumkum);color:var(--kumkum-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.quiet:hover{border-color:var(--ink)}

/* Nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid transparent;transition:border-color .2s}
nav.top.scrolled{border-bottom-color:var(--line)}
nav.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.mark .w{font-family:"Gotu","Hind",serif;font-size:1.3rem;line-height:1.1;display:block}
.mark .dv{font-size:.8rem;color:var(--muted);line-height:1.2;display:block}
.navr{display:flex;align-items:center;gap:10px}
.lang{position:relative}
.lang select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 32px 8px 34px;cursor:pointer;font-family:"Hind","Noto Sans Kannada","Noto Sans Tamil","Noto Sans Telugu",sans-serif}
.lang svg{position:absolute;pointer-events:none;top:50%;transform:translateY(-50%)}
.lang .g{left:11px}.lang .c{right:11px}
nav.top .btn{padding:10px 16px;font-size:.92rem}
@media (max-width:560px){nav.top .btn{display:none}.mark .w{font-size:1.15rem}}

/* Hero */
.hero{position:relative;overflow:hidden}
.toran{display:block;width:100%;height:64px}
.hero .in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:16px 64px}
@media (max-width:860px){.hero .in{grid-template-columns:1fr;gap:36px;padding-block:8px 48px}}
.kicker{font-family:var(--display);color:var(--haldi);font-size:1.1rem;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kicker::after{content:"";height:1px;width:48px;background:var(--haldi);opacity:.6}
.hero h1 em{font-style:normal;color:var(--kumkum)}
.hero .sub{font-size:1.15rem;color:var(--muted);max-width:34em;margin-top:20px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .note{margin-top:16px;font-size:.88rem;color:var(--muted)}
.stage{position:relative;justify-self:center;width:min(340px,100%);display:grid;place-items:center}
.kolam{position:absolute;inset:-30px -40px;width:calc(100% + 80px);height:calc(100% + 60px);color:var(--kolam);opacity:.18;pointer-events:none}

/* Phone */
.phone{position:relative;width:min(290px,100%);aspect-ratio:9/18.5;background:#0B0805;border-radius:42px;padding:10px;box-shadow:0 30px 60px -20px rgba(30,20,5,.45),0 0 0 1px rgba(0,0,0,.2);animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.screen{height:100%;border-radius:33px;background:radial-gradient(120% 60% at 50% 105%,#4A3415 0%,var(--night) 62%);color:var(--night-ink);padding:24px 18px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.pbar{display:flex;gap:3px}.pbar i{flex:1;height:3px;border-radius:3px;background:rgba(233,184,80,.22)}.pbar i.on{background:var(--brass)}
.screen .st{font-size:.72rem;color:var(--brass)}
.screen h4{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0;color:#FFF5E0;line-height:1.25}
.screen .do{font-size:.8rem;line-height:1.5}
.mantra{border:1px solid rgba(233,184,80,.35);background:rgba(233,184,80,.06);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.mantra .l{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.mantra .s{font-size:1rem;color:#FFF1CF;line-height:1.5}
.mantra .t{font-size:.72rem;font-style:italic;color:var(--night-muted)}
.fam{background:rgba(240,104,126,.14);border-radius:10px;padding:8px 10px;font-size:.74rem;line-height:1.45}
.fam b{display:block;color:#F7B3BE;font-size:.68rem}
.screen .nx{margin-top:auto;background:var(--brass);color:#2A1E07;border-radius:999px;text-align:center;padding:10px;font-weight:600;font-size:.85rem}
.flame{transform-origin:50% 100%;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scaleY(1) rotate(-1deg)}50%{transform:scaleY(1.08) rotate(1.5deg)}}

/* Ticker */
.ticker{border-block:1px solid var(--line);background:var(--surface);overflow:hidden;white-space:nowrap}
.ticker .track{display:inline-flex;gap:28px;padding-block:14px;animation:tick 60s linear infinite;font-family:"Gotu","Hind",serif;font-size:1.05rem;color:var(--muted)}
.ticker .track span{display:inline-flex;align-items:center;gap:28px}
.ticker .track span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--haldi)}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.flame,.phone,.ticker .track{animation:none}.ticker{white-space:normal}.ticker .track{flex-wrap:wrap;justify-content:center;padding-inline:20px}}

/* Sections */
section.band{padding-block:84px}
@media (max-width:700px){section.band{padding-block:60px}}
.sec-head{display:flex;flex-direction:column;gap:12px;max-width:42em;margin-bottom:36px}
.sec-head p.lead{color:var(--muted);font-size:1.08rem}

/* Problem */
.amma{background:var(--surface);border-bottom:1px solid var(--line)}
.amma .in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:center}
@media (max-width:860px){.amma .in{grid-template-columns:1fr;gap:32px}}
.chat{background:var(--ground);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px;max-width:440px;width:100%;justify-self:center}
.chat .hd{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.chat .av{width:34px;height:34px;border-radius:50%;background:var(--haldi-soft);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.chat .hd b{display:block;font-size:.95rem;line-height:1.2}
.chat .hd span{font-size:.75rem;color:var(--muted)}
.msg{max-width:84%;padding:8px 12px 6px;border-radius:14px;font-size:.92rem;line-height:1.45}
.msg small{display:block;text-align:right;font-size:.66rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.msg.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:4px}
.msg.in{align-self:flex-start;background:var(--bubble-in);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.voice{display:flex;align-items:center;gap:8px;min-width:200px}
.msg.voice .p{width:26px;height:26px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;flex:none}
.msg.voice .wv{flex:1;display:flex;gap:2px;align-items:center;height:18px}
.msg.voice .wv i{flex:1;background:var(--muted);opacity:.55;border-radius:2px}
.amma .copy{display:flex;flex-direction:column;gap:18px}
.amma .copy p{color:var(--muted);font-size:1.08rem;max-width:32em}
.amma .copy p strong{color:var(--ink);font-weight:600}

/* Demo */
.demo{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:40px;align-items:start}
@media (max-width:860px){.demo{grid-template-columns:1fr;gap:28px}}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--surface)}
.dlabel{font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:8px;display:block}
.dpanel{background:radial-gradient(120% 80% at 50% 110%,#4A3415 0%,var(--night) 60%);color:var(--night-ink);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;min-height:430px;color-scheme:dark}
.dpanel .st{font-size:.82rem;color:var(--brass)}
.dpanel h3{font-size:1.6rem;color:#FFF5E0}
.dpanel .do{font-size:1.02rem;line-height:1.6}
.dpanel .mantra .s{font-size:1.25rem}
.dpanel .why{color:var(--night-muted);font-size:.95rem;border-left:2px solid #9C7B3A;padding-left:12px}
.dpanel .why b{color:var(--brass);font-weight:600}
.dpanel .tip{background:rgba(233,184,80,.12);border-radius:10px;padding:8px 12px;font-size:.88rem}
.dpanel .fam{font-size:.9rem}
.dpanel .fam b{font-size:.75rem}
.dnav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:auto}
.dnav button{border:0;border-radius:999px;padding:13px;font:inherit;font-weight:600;cursor:pointer}
.dnav .b{background:rgba(255,255,255,.08);color:var(--night-ink)}
.dnav .b[disabled]{opacity:.35;cursor:default}
.dnav .n{background:var(--brass);color:#2A1E07}
.addnote{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.addnote .row{display:flex;gap:8px}
.addnote input{flex:1;min-width:0;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.addnote button{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;background:var(--leaf);color:var(--surface);cursor:pointer;white-space:nowrap}
.addnote .fullapp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:18px}.fullapp span{font-size:.85rem;color:var(--muted)}
@media (max-width:820px){nav.top .navtry{display:none}}
.addnote .linkbtn,.linkbtn,.linkbtn{background:none;border:0;padding:6px 0;font:inherit;font-weight:600;color:var(--leaf);cursor:pointer;text-align:left;align-self:flex-start;border-radius:0}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:820px){.steps{grid-template-columns:1fr}}
.step-c{display:flex;flex-direction:column;gap:10px;padding-top:20px;border-top:2px solid var(--ink)}
.step-c .n{font-size:.92rem;color:var(--kumkum);font-weight:600}
.step-c p{color:var(--muted)}

/* Night band */
.night{background:radial-gradient(90% 120% at 80% 110%,#3F2C12 0%,var(--night) 58%);color:var(--night-ink);color-scheme:dark}
.night .in{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center}
@media (max-width:860px){.night .in{grid-template-columns:1fr;gap:36px}}
.night .eyebrow{color:var(--brass)}
.night h2{color:#FFF5E0}
.night p.lead{color:var(--night-muted)}
.night ul{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
.night li{display:grid;grid-template-columns:22px 1fr;gap:12px}
.night li svg{margin-top:5px}
.night li b{color:#FFF5E0;font-weight:600}
.night li span{color:var(--night-muted)}
.lamps{display:flex;justify-content:center;gap:clamp(8px,3vw,28px);align-items:flex-end}
.night .in > *{min-width:0}
.lamps{min-width:0}
.lamps svg{opacity:.25;transition:opacity 1.2s ease;flex:0 1 auto;min-width:0;max-width:19%;height:auto}
.lamps svg:nth-child(3){max-width:28%}
.lamps.lit svg{opacity:1}
.lamps.lit svg:nth-child(2){transition-delay:.25s}.lamps.lit svg:nth-child(3){transition-delay:.5s}.lamps.lit svg:nth-child(4){transition-delay:.75s}.lamps.lit svg:nth-child(5){transition-delay:1s}

/* Features */
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden}
@media (max-width:860px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.feats{grid-template-columns:1fr}}
.feat{background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:10px;min-width:0}
.feat svg{width:28px;height:28px;color:var(--leaf)}
.feat p{color:var(--muted);font-size:.96rem}

/* Trust */
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
@media (max-width:900px){.trust{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.trust{grid-template-columns:1fr}}
.tcard{display:flex;flex-direction:column;gap:10px}
.tcard .ic{width:44px;height:44px;border-radius:50%;background:var(--haldi-soft);display:grid;place-items:center;color:var(--ink)}
.tcard p{color:var(--muted);font-size:.96rem}

/* Roadmap */
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:820px){.tl{grid-template-columns:1fr}}
.tl > div{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px}
.tl .d{color:var(--kumkum);font-weight:600;font-size:.95rem}
.tl p{color:var(--muted);font-size:.96rem}
.tl > div.now{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.tradline{margin-top:18px;color:var(--muted);font-size:.95rem}

/* FAQ */
.faq{display:flex;flex-direction:column;border-top:1px solid var(--line);max-width:780px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:18px 40px 18px 0;font-weight:600;font-size:1.05rem;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:8px;top:50%;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.faq details[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
.faq details p{padding:0 0 18px;color:var(--muted);max-width:40em}

/* CTA */
.cta{background:var(--leaf);color:#F6F3E6;position:relative;overflow:hidden}
.cta .in{display:flex;flex-direction:column;align-items:flex-start;gap:20px;padding-block:80px}
.cta .eyebrow{color:#CFE3CF}
.cta h2{color:#FFF8E6;max-width:18em}
.cta p{color:#D6E6D3;max-width:36em;font-size:1.08rem}
.cta .btn.light{background:#FFF8E6;color:#1A211C}
.cta .share{display:flex;gap:16px;flex-wrap:wrap;font-size:.92rem;color:#D6E6D3}
.cta .share a{color:#FFF8E6;font-weight:600}
.cta .kolam2{position:absolute;right:-60px;bottom:-60px;width:360px;height:360px;color:#FFF8E6;opacity:.1;pointer-events:none}
.pending{display:none;background:rgba(255,255,255,.12);border-radius:12px;padding:12px 16px;font-size:.95rem;max-width:36em}
.pending.show{display:block}
footer{padding-block:36px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>

<nav class="top" id="nav"><div class="in">
  <a class="mark" href="#top" aria-label="Vidhi-Vidhan">
    <svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><path class="flame" d="M20 4c-4 6-5 9-5 11.5a5 5 0 0 0 10 0C25 13 24 10 20 4z" fill="#E9B850"/><path d="M7 21h26c-1.5 7.5-7 12-13 12S8.5 28.5 7 21z" fill="#AE1530"/><path d="M7 21h26" stroke="#C98A06" stroke-width="2" stroke-linecap="round"/></svg>
    <span><span class="w">Vidhi-Vidhan</span><span class="dv" id="brandSub">विधि-विधान</span></span>
  </a>
  <div class="navr">

q1:"ಇದು ಉಚಿತವೇ?",a1:"ಮೊದಲ ಪಟ್ಟಿಗೆ ಸೇರುವುದು ಉಚಿತ, ಹಬ್ಬದ ಮಾರ್ಗದರ್ಶಿಗಳೂ ಉಚಿತವಾಗಿರುತ್ತವೆ. ಹೆಚ್ಚುವರಿ ಸೌಲಭ್ಯಗಳ ಪಾವತಿಸುವ ಕುಟುಂಬ ಯೋಜನೆ ಮುಂದೆ ಬರಬಹುದು.",

q1:"இது இலவசமா?",a1:"முன்பதிவுப் பட்டியலில் சேர்வது இலவசம், பண்டிகை வழிகாட்டிகளும் இலவசம். கூடுதல் வசதிகளுடன் கட்டணக் குடும்பத் திட்டம் பின்னர் வரலாம்.",
q2:"எந்த சம்பிரதாயங்கள் இருக்கும்?",a2:"கன்னட, தமிழ், தெலுங்கு குடும்பங்களுடன் தொடங்கி, ஒவ்வொன்றாக மேலும் சேர்ப்போம். சேரும்போது உங்களுடையதைச் சொல்லுங்கள்.",
q3:"இது எங்கள் புரோகிதருக்கு மாற்றா?",a3:"இல்லை. நீங்களே வீட்டில் செய்யும் சடங்குகளுக்கு உதவும்; பெரிய நிகழ்வுகளில் குடும்பம் என்ன செய்யும், புரோகிதர் என்ன செய்வார் என்று காட்டும்.",
q4:"எங்கள் வீட்டில் வேறு மாதிரி செய்தால்?",a4:"அதுதான் முக்கியம். படிகளை ஆன் அல்லது ஆஃப் செய்யலாம், குடும்பக் குறிப்புகள் சேர்க்கலாம், தெரியாததைப் பெரியவர்களிடம் கேட்கலாம்.",
q5:"எந்த மொழிகள்?",a5:"ஆப் ஆங்கிலம், இந்தி, கன்னடம், தமிழ், தெலுங்கில் இருக்கும். மந்திரங்கள் உங்கள் எழுத்தில், ஆங்கில ஒலிபெயர்ப்புடன்.",

q7:"எப்போது பயன்படுத்தலாம்?",a7:"யுகாதி 2027-க்கு பெங்களூரில் பைலட், ஆகஸ்ட் 2027 முதல் முழுப் பண்டிகைக் காலம். முன்பதிவுப் பட்டியலில் உள்ளவர்களுக்கு முதல் வாய்ப்பு.",
q8:"இதை யார் உருவாக்குகிறார்கள்?",a8:"விதி-விதானம் பெங்களூரில் உருவாகும் ஒரு சுயாதீனத் திட்டம். புதுப்பிப்புகளுக்கு LinkedIn-இல் தொடருங்கள்.",

  $("addnote").innerHTML = `<button class="linkbtn" data-d="addopen" aria-expanded="false">+ ${esc(t("demo_add"))}</button>`;
}
document.addEventListener("click", e=>{
  const tb = e.target.closest("#tradSeg button"); if(tb){ trad = tb.dataset.t; loadFont(trad); renderDemo(); return; }
  const d = e.target.closest("[data-d]"); if(!d) return;
  const a = d.dataset.d;
  if(a==="next"){ step++; renderDemo(); }
  else if(a==="back"){ step = Math.max(0, step-1); renderDemo(); }
  else if(a==="again"){ step = 0; renderDemo(); }
  else if(a==="addopen"){
    $("addnote").innerHTML = `<label class="dlabel" for="noteIn" style="margin:0">${esc(t("demo_add"))}</label><div class="row"><input id="noteIn" type="text" maxlength="140" placeholder="${esc(t("demo_add_ph"))}"><button data-d="save">${esc(t("demo_save"))}</button></div>`;
    $("noteIn").focus();
  }
  else if(a==="save"){ const v = $("noteIn").value.trim(); if(!v) return; const key = trad + "-" + STEPS[step].k; (notes[key] ||= []).push(v); renderDemo(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="noteIn"){ e.preventDefault(); document.querySelector('[data-d="save"]').click(); } });

/* ---------- Language ---------- */
function applyLang(){
  document.documentElement.lang = L;
  if(L !== "en" && L !== "hi") loadFont(L);
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-ih]").forEach(el=>{ el.innerHTML = t(el.dataset.ih); });
  $("brandSub").textContent = BRAND[L]; $("footBrand").textContent = BRAND[L]; $("kicker").textContent = KICK[L];
  const ps = (L==="ta"||L==="te"||L==="kn") ? L : "kn"; loadFont(ps);
  $("phMantra").textContent = MANTRA.l[ps]; $("phMantra").style.fontFamily = `var(--${ps})`;
  $("phone").setAttribute("aria-label", t("s4_t") + ". " + t("s4_d"));
  $("faq").innerHTML = [1,2,3,4,5,6,7,8].map(i=>`<details><summary>${esc(t("q"+i))}</summary><p>${esc(t("a"+i))}</p></details>`).join("");
  $("langSel").value = L;
  const url = location.href.split("#")[0], txt = t("share_text");
  $("shareLi").href = "https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(url);
  $("shareX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(txt) + "&url=" + encodeURIComponent(url);
  $("shareWa").href = "https://wa.me/?text=" + encodeURIComponent(txt + " " + url);
  renderDemo();
}
$("langSel").addEventListener("change", e=>{ L = e.target.value; try{ localStorage.setItem("vv-lang", L); }catch(err){} applyLang(); });

/* ---------- Join ---------- */
document.querySelectorAll(".js-form, .js-join").forEach(a=>{
  if(FORM_URL){ a.href = FORM_URL; a.target = "_blank"; a.rel = "noopener"; }
  else if(a.classList.contains("js-form")) a.addEventListener("click", e=>{ e.preventDefault(); $("pending").classList.add("show"); });
});

/* ---------- Decorations ---------- */
function toran(){
  const svg = $("toran"), W = 1200, n = 30, parts = [];
  parts.push(`<path d="M0 10 Q600 30 1200 10" fill="none" stroke="#B8742A" stroke-width="2"/>`);
  for(let i=0;i<n;i++){
    const x = (i+.5)*W/n, s = x/W, y = 10 + 40*s*(1-s);
    const leafy = i % 3 !== 1;
    if(leafy){ const c = i%2 ? "#3F7D3A" : "#2E6A3E", len = 30 + (i%2)*6;
      parts.push(`<path d="M${x} ${y} C${x-9} ${y+len*.35} ${x-6} ${y+len*.8} ${x} ${y+len} C${x+6} ${y+len*.8} ${x+9} ${y+len*.35} ${x} ${y}Z" fill="${c}"/><path d="M${x} ${y+3} L${x} ${y+len-3}" stroke="#9BC48F" stroke-width=".8" opacity=".7"/>`); }
    else { parts.push(`<circle cx="${x}" cy="${y+7}" r="6" fill="#E9A21B"/><circle cx="${x}" cy="${y+18}" r="5.5" fill="#F0B830"/><circle cx="${x}" cy="${y+28}" r="5" fill="#E9A21B"/>`); }
  }
  svg.innerHTML = parts.join("");
}
function kolam(svg){
  const g = [], step = 50, o = 50, N = 7;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const x = o + c*step, y = o + r*step; if(Math.abs(r-3)+Math.abs(c-3) <= 3) g.push(`<circle cx="${x}" cy="${y}" r="3.2" fill="currentColor"/>`); }
  const loops = [];
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){ if(Math.abs(r-3)+Math.abs(c-3) > 3) continue; const x = o + c*step, y = o + r*step;
    loops.push(`<path d="M${x-25} ${y} Q${x} ${y-25} ${x+25} ${y} Q${x} ${y+25} ${x-25} ${y}Z" fill="none" stroke="currentColor" stroke-width="1.6"/>`); }
  svg.innerHTML = `<g>${loops.join("")}${g.join("")}<circle cx="200" cy="200" r="178" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 8"/></g>`;
}
function lamps(){
  const one = (w, d) => `<svg width="${w}" viewBox="0 0 120 110"><defs><radialGradient id="lg${w}${d}" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="#FFD873" stop-opacity=".5"/><stop offset="1" stop-color="#FFD873" stop-opacity="0"/></radialGradient></defs><circle cx="60" cy="45" r="44" fill="url(#lg${w}${d})"/><path class="flame" style="animation-delay:${d}s" d="M60 18c-7 11-9 17-9 22a9 9 0 0 0 18 0c0-5-2-11-9-22z" fill="#FFC54D"/><path d="M60 30c-3 5-4 8-4 10a4 4 0 0 0 8 0c0-2-1-5-4-10z" fill="#FFF3C4"/><path d="M18 62h84c-4 18-20 30-42 30S22 80 18 62z" fill="#B8742A"/><path d="M18 62h84" stroke="#E9B850" stroke-width="3" stroke-linecap="round"/></svg>`;
  $("lamps").innerHTML = one(52,0) + one(74,.4) + one(110,.8) + one(74,1.2) + one(52,1.6);
  const el = $("lamps");
  if("IntersectionObserver" in window){ const io = new IntersectionObserver(es=>{ es.forEach(x=>{ if(x.isIntersecting){ el.classList.add("lit"); io.disconnect(); } }); }, {threshold:.4}); io.observe(el); }
  else el.classList.add("lit");
  setTimeout(()=>el.classList.add("lit"), 4000);
}
const half = FESTS.map(f=>`<span>${f}</span>`).join("");
$("track").innerHTML = half + half;
toran(); kolam($("kolam")); kolam($("kolam2")); lamps();
applyLang();
const nav = $("nav");
addEventListener("scroll", ()=>nav.classList.toggle("scrolled", scrollY > 8), {passive:true});
</script>
